let db = null;
let fbResolve = null;
const fbReady = new Promise(r=>{ fbResolve=r; });

function loadFirebase() {
  if(window._fbLoaded) { fbResolve(window._db); return; }
  const scripts = [
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js",
  ];
  let loaded = 0;
  scripts.forEach(src=>{
    const s=document.createElement("script"); s.src=src; s.async=false;
    s.onload=()=>{ loaded++; if(loaded===scripts.length) initFB(); };
    document.head.appendChild(s);
  });
}
function initFB() {
  if(!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
  db = window.firebase.firestore();
  db.enablePersistence().catch(()=>{});
  window._db=db; window._fbLoaded=true;
  fbResolve(db);
}
loadFirebase();

// 이미지 업로드 (base64 리사이즈 방식 — CORS 문제 없음)
const uploadImage = async (file) => {
  if(!file) return null;
  if(file.size > 5*1024*1024) throw new Error("파일 크기는 5MB 이하여야 합니다");
  const allowed = ["image/jpeg","image/png","image/gif","image/webp"];
  if(!allowed.includes(file.type)) throw new Error("JPG, PNG, GIF, WEBP 파일만 가능합니다");
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX = 800;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX) {
          if(w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = () => reject(new Error("이미지 로드 실패"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("파일 읽기 실패"));
    reader.readAsDataURL(file);
  });
};

function RegisterPage({ onBack, onSuccess }) {
  const [form, setForm] = useState({name:"",email:"",pw:"",pw2:""});
  const [err, setErr]   = useState("");
  const [done, setDone] = useState(false);

  const handle = () => {
    const {name,email,pw,pw2} = form;
    if(!name.trim()||!email.trim()||!pw||!pw2) { setErr("모든 항목을 입력해주세요."); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr("이메일 형식이 올바르지 않습니다."); return; }
    if(pw.length < 6) { setErr("비밀번호는 6자 이상이어야 합니다."); return; }
    if(pw !== pw2)    { setErr("비밀번호가 일치하지 않습니다."); return; }
    const admins = STORAGE.getAdmins();
    if(admins.find(a=>a.email===email)) { setErr("이미 등록된 이메일입니다."); return; }
    const now = new Date().toLocaleString("ko-KR");
    STORAGE.setAdmins([...admins, {id:Date.now(), name:name.trim(), email:email.trim(), pw, status:"pending", createdAt:now, approvedAt:null, approvedBy:null}]);
    setDone(true);
  };

  if(done) return (
    <div style={{textAlign:"center",padding:"40px 0"}}>
      <div style={{fontSize:52,marginBottom:16}}>✅</div>
      <div style={{fontSize:22,fontWeight:800,color:"#2ecc71",marginBottom:8}}>신청 완료!</div>
      <div style={{fontSize:17,color:"#64748b",lineHeight:1.7,marginBottom:24}}>최고관리자 승인 후 로그인이 가능합니다.<br/>승인 결과를 기다려 주세요.</div>
      <button onClick={onBack} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"12px 24px",color:"#94a3b8",fontWeight:700,fontSize:17,cursor:"pointer"}}>로그인으로 돌아가기</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:24}}>
        <button onClick={onBack} style={{background:"rgba(255,255,255,.06)",border:"none",borderRadius:8,width:32,height:32,color:"#94a3b8",fontSize:22,cursor:"pointer"}}>←</button>
        <div style={{fontSize:21,fontWeight:800,color:"#e2e8f0"}}>기록 담당자 신청</div>

      <div style={{background:"rgba(241,196,15,.07)",border:"1px solid #f1c40f30",borderRadius:10,padding:"12px 14px",marginBottom:20,fontSize:16,color:"#94a3b8",lineHeight:1.6}}>
        신청 후 최고관리자 검토·승인이 완료되어야 로그인할 수 있습니다.
      </div>
      {[{label:"이름 *",key:"name",ph:"홍길동"},{label:"이메일 *",key:"email",ph:"example@email.com"},{label:"비밀번호 * (6자 이상)",key:"pw",ph:"비밀번호 입력",type:"password"},{label:"비밀번호 확인 *",key:"pw2",ph:"비밀번호 재입력",type:"password"}].map(f=>(
        <div key={f.key} style={{marginBottom:14}}>

// ── 최고관리자 패널 ───────────────────────────────────────────────────────────
function MasterPanel({ onLogout, showNotif }) {
  const [admins, setAdmins]     = useState(STORAGE.getAdmins());
  const [newMPw, setNewMPw]     = useState("");
  const [newMPw2, setNewMPw2]   = useState("");
  const [pwMsg, setPwMsg]       = useState("");
  const [activeTab, setActiveTab] = useState("pending");
  const [confirmLogout, setConfirmLogout] = useState(false);

  const refresh = () => setAdmins(STORAGE.getAdmins());

  const approve = (id) => {
    const now = new Date().toLocaleString("ko-KR");
    const updated = STORAGE.getAdmins().map(a=>a.id===id?{...a,status:"approved",approvedAt:now,approvedBy:"최고관리자"}:a);
    STORAGE.setAdmins(updated); refresh();
    showNotif("✅ 승인 완료","#2ecc71");
  };
  const reject = (id) => {
    const updated = STORAGE.getAdmins().map(a=>a.id===id?{...a,status:"rejected"}:a);
    STORAGE.setAdmins(updated); refresh();
    showNotif("🚫 거부 처리","#ff4757");
  };
  const revoke = (id) => {
    const updated = STORAGE.getAdmins().map(a=>a.id===id?{...a,status:"rejected",approvedAt:null}:a);
    STORAGE.setAdmins(updated); refresh();
    showNotif("🔒 권한 회수","#f1c40f");
  };
  const remove = (id) => {
    STORAGE.setAdmins(STORAGE.getAdmins().filter(a=>a.id!==id)); refresh();
    showNotif("🗑 계정 삭제","#ff4757");
  };

  const changeMasterPw = () => {
    if(!newMPw||!newMPw2)         { setPwMsg("비밀번호를 입력해주세요."); return; }
    if(newMPw.length<6)           { setPwMsg("6자 이상 입력해주세요."); return; }
    if(newMPw!==newMPw2)          { setPwMsg("비밀번호가 일치하지 않습니다."); return; }
    STORAGE.setMasterPw(newMPw);
    setNewMPw(""); setNewMPw2(""); setPwMsg("✅ 변경 완료!");
    setTimeout(()=>setPwMsg(""),2000);
  };

  const pending  = admins.filter(a=>a.status==="pending");
  const approved = admins.filter(a=>a.status==="approved");
  const rejected = admins.filter(a=>a.status==="rejected");

  const tabs = [
    {id:"pending",  label:`대기 (${pending.length})`,  color:"#f1c40f"},
    {id:"approved", label:`승인 (${approved.length})`, color:"#2ecc71"},
    {id:"rejected", label:`거부 (${rejected.length})`, color:"#ff4757"},
    {id:"settings", label:"설정",                      color:"#94a3b8"},
  ];

  const list = activeTab==="pending"?pending:activeTab==="approved"?approved:activeTab==="rejected"?rejected:[];

  const AccountCard = ({a}) => (
    <div style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:8}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
        <div style={{width:40,height:40,borderRadius:10,background:"rgba(241,196,15,.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📝</div>
        <div style={{flex:1}}>
          <div style={{fontSize:18,fontWeight:700,color:"#e2e8f0"}}>{a.name}</div>
          <div style={{fontSize:15,color:"#475569"}}>{a.email}</div>
          <div style={{fontSize:14,color:"#334155",marginTop:4}}>신청: {a.createdAt}{a.approvedAt?` · 처리: ${a.approvedAt}`:""}</div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          {a.status==="pending"&&<>
            <button onClick={()=>approve(a.id)} style={{background:"rgba(46,204,113,.2)",border:"1px solid #2ecc7140",borderRadius:7,padding:"6px 12px",color:"#2ecc71",fontSize:15,fontWeight:700,cursor:"pointer"}}>승인</button>
            <button onClick={()=>reject(a.id)}  style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:7,padding:"6px 12px",color:"#ff4757",fontSize:15,fontWeight:700,cursor:"pointer"}}>거부</button>
          </>}
          {a.status==="approved"&&
            <button onClick={()=>revoke(a.id)} style={{background:"rgba(241,196,15,.12)",border:"1px solid #f1c40f40",borderRadius:7,padding:"6px 12px",color:"#f1c40f",fontSize:15,fontWeight:700,cursor:"pointer"}}>권한 회수</button>
          }
          {a.status==="rejected"&&<>
            <button onClick={()=>approve(a.id)} style={{background:"rgba(46,204,113,.15)",border:"1px solid #2ecc7130",borderRadius:7,padding:"6px 12px",color:"#2ecc71",fontSize:15,fontWeight:700,cursor:"pointer"}}>재승인</button>
            <button onClick={()=>remove(a.id)}  style={{background:"rgba(255,71,87,.08)",border:"1px solid #ff475730",borderRadius:7,padding:"6px 12px",color:"#ff4757",fontSize:15,fontWeight:700,cursor:"pointer"}}>삭제</button>
          </>}
        </div>
      </div>
    </div>
  );

  return (
    <div style={{background:"#020817",minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:"#e2e8f0"}}>
      {/* 헤더 */}
      <div style={{background:"#0a0f1e",borderBottom:"1px solid #1e293b",padding:"14px 24px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#ff4757,#c0392b)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🛡</div>
        <div>
          <div style={{fontSize:19,fontWeight:900}}>최고관리자 패널</div>
          <div style={{fontSize:14,color:"#475569"}}>기록 담당자 계정 승인·관리</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          {pending.length>0&&<div style={{background:"rgba(241,196,15,.15)",border:"1px solid #f1c40f40",borderRadius:20,padding:"3px 10px",fontSize:15,color:"#f1c40f",fontWeight:700}}>
            대기 {pending.length}건
          </div>}
          <button onClick={()=>setConfirmLogout(true)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475730",borderRadius:8,padding:"6px 12px",color:"#ff4757",fontSize:15,fontWeight:600,cursor:"pointer"}}>로그아웃</button>
        </div>
      </div>

      {/* 로그아웃 확인 모달 */}
      {confirmLogout&&(
        <Modal onClose={()=>setConfirmLogout(false)}>
          <div style={{textAlign:"center",padding:"8px 0 20px"}}>
            <div style={{fontSize:40,marginBottom:12}}>🛡</div>
            <div style={{fontSize:19,fontWeight:800,color:"#e2e8f0",marginBottom:6}}>로그아웃 하시겠습니까?</div>
            <div style={{fontSize:16,color:"#64748b",marginBottom:20}}>최고관리자 세션이 종료됩니다</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <button onClick={()=>setConfirmLogout(false)} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"12px 0",color:"#94a3b8",fontWeight:700,fontSize:17,cursor:"pointer"}}>취소</button>
              <button onClick={onLogout} style={{background:"linear-gradient(135deg,#ff4757,#c0392b)",border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:17,cursor:"pointer"}}>로그아웃</button>
            </div>
          </div>
        </Modal>
      )}

      <div style={{maxWidth:680,margin:"0 auto",padding:"24px 16px"}}>
        {/* 탭 */}
        <div style={{display:"flex",gap:6,marginBottom:20}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{background:activeTab===t.id?`${t.color}20`:"#0a0f1e",border:`1px solid ${activeTab===t.id?t.color:"#1e293b"}`,borderRadius:8,padding:"8px 14px",color:activeTab===t.id?t.color:"#475569",fontWeight:activeTab===t.id?700:400,fontSize:16,cursor:"pointer"}}>
              {t.label}
            </button>
          ))}
        </div>

        {/* 계정 목록 */}
        {activeTab!=="settings"&&(
          <div>
            {list.length===0
              ?<div style={{textAlign:"center",padding:"40px 0",color:"#334155"}}>
                <div style={{fontSize:32,marginBottom:10}}>📋</div>
                <div style={{fontSize:17}}>{activeTab==="pending"?"대기 중인 신청이 없습니다":activeTab==="approved"?"승인된 계정이 없습니다":"거부된 계정이 없습니다"}</div>
              </div>
              :list.map(a=><AccountCard key={a.id} a={a}/>)
            }
          </div>
        )}

        {/* 설정 */}
        {activeTab==="settings"&&(
          <div>
            <div style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:14,padding:20,marginBottom:16}}>
              <div style={{fontSize:18,fontWeight:700,marginBottom:16}}>최고관리자 비밀번호 변경</div>
              <div style={{background:"rgba(255,71,87,.06)",border:"1px solid #ff475720",borderRadius:8,padding:"10px 12px",marginBottom:14,fontSize:15,color:"#64748b",lineHeight:1.6}}>
                ⚠ 현재 비밀번호는 브라우저 로컬 저장소에 보관됩니다. 실제 운영 환경에서는 서버 기반 인증을 사용해주세요.
              </div>
              <div style={{marginBottom:10}}><SL>새 비밀번호 (6자 이상)</SL><Inp type="password" value={newMPw} onChange={setNewMPw} placeholder="새 비밀번호"/></div>
              <div style={{marginBottom:14}}><SL>새 비밀번호 확인</SL><Inp type="password" value={newMPw2} onChange={setNewMPw2} placeholder="새 비밀번호 재입력"/></div>
              {pwMsg&&<div style={{fontSize:16,color:pwMsg.startsWith("✅")?"#2ecc71":"#ff4757",marginBottom:10}}>{pwMsg}</div>}
              <button onClick={changeMasterPw} style={{background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"12px 0",color:"#000",fontWeight:800,fontSize:17,cursor:"pointer",width:"100%"}}>비밀번호 변경</button>
            </div>
            <div style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:14,padding:20}}>
              <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>계정 현황</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                {[{label:"총 신청",value:admins.length,color:"#94a3b8"},{label:"승인됨",value:approved.length,color:"#2ecc71"},{label:"대기중",value:pending.length,color:"#f1c40f"}].map(s=>(

                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── 카드 이벤트 모달 (팀·선수 선택) ─────────────────────────────────────────
function CardEventModal({ type, match, curMin, onConfirm, onClose }) {
  const isY = type==="yellow";
  const color = isY ? "#f1c40f" : "#e74c3c";
  const icon  = isY ? "🟨" : "🟥";
  const hP = [...match.lineup.home.gk,...match.lineup.home.df,...match.lineup.home.mf,...match.lineup.home.fw];
  const aP = [...match.lineup.away.gk,...match.lineup.away.df,...match.lineup.away.mf,...match.lineup.away.fw];
  const [team,   setTeam]   = useState(null);
  const [player, setPlayer] = useState(null);
  const [reason, setReason] = useState("");
  const [min,    setMin]    = useState(curMin);
  const players = team==="home" ? hP : team==="away" ? aP : [];
  const ok = team && player;

  return (
    <Modal onClose={onClose}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
        <span style={{fontSize:26}}>{icon}</span>
        <div style={{fontSize:19,fontWeight:800,color}}>{isY?"옐로":"레드"}카드 등록</div>
        <button onClick={onClose} style={{marginLeft:"auto",background:"rgba(255,255,255,.06)",border:"none",borderRadius:8,width:30,height:30,color:"#94a3b8",fontSize:20,cursor:"pointer"}}>✕</button>
      </div>
      {/* 시간 */}
      <div style={{marginBottom:14}}>
        <SL>⏱ 발생 시간 (분)</SL>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>setMin(m=>Math.max(1,m-1))} style={{width:32,height:32,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:20,cursor:"pointer"}}>−</button>
          <input type="number" min={1} max={90} value={min} onChange={e=>setMin(Math.max(1,Math.min(90,+e.target.value)))}
            style={{width:56,textAlign:"center",background:"#0f172a",border:"1px solid #f1c40f",borderRadius:7,padding:"6px 0",color:"#f1c40f",fontSize:21,fontWeight:900,outline:"none",fontFamily:"inherit"}}/>
          <span style={{color:"#64748b",fontSize:16}}>분</span>
          <button onClick={()=>setMin(m=>Math.min(90,m+1))} style={{width:32,height:32,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:20,cursor:"pointer"}}>+</button>
        </div>
      </div>
      {/* 팀 선택 */}
      <div style={{marginBottom:12}}>
        <SL>팀 *</SL>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[{key:"home",info:match.home},{key:"away",info:match.away}].map(({key,info})=>(
            <button key={key} onClick={()=>{setTeam(key);setPlayer(null);}} style={{display:"flex",alignItems:"center",gap:8,background:team===key?`${info.color}20`:"#0f172a",border:`1px solid ${team===key?info.color:"#1e3060"}`,borderRadius:10,padding:"10px 12px",color:team===key?info.color:"#64748b",fontWeight:700,fontSize:16,cursor:"pointer"}}>
              <span style={{fontSize:22}}>{info.emoji}</span>{info.name}
            </button>
          ))}
        </div>
      </div>
      {/* 선수 선택 */}
      {team&&(
        <div style={{marginBottom:12}}>
          <SL>선수 *</SL>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:160,overflowY:"auto"}}>
            {players.map(p=>(
              <button key={p} onClick={()=>setPlayer(p)} style={{background:player===p?`${color}20`:"#0f172a",border:`1px solid ${player===p?color:"#1e3060"}`,borderRadius:8,padding:"8px 10px",color:player===p?color:"#94a3b8",fontWeight:player===p?700:400,fontSize:15,cursor:"pointer",textAlign:"left"}}>{p}</button>
            ))}
          </div>
        </div>
      )}
      {/* 사유 */}
      <div style={{marginBottom:18}}>
        <SL>사유 (선택)</SL>
        <input value={reason} onChange={e=>setReason(e.target.value)} placeholder="거친 태클, 핸드볼, 지연행위..."
          style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:17,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
      </div>
      <button onClick={()=>ok&&onConfirm(team,player,reason||(isY?"옐로카드":"레드카드"),min)} style={{width:"100%",background:ok?`linear-gradient(135deg,${color},${color}bb)`:"#1e293b",border:"none",borderRadius:10,padding:"13px 0",color:ok?isY?"#000":"#fff":"#475569",fontWeight:800,fontSize:18,cursor:ok?"pointer":"not-allowed"}}>
        {ok?`${icon} ${player} · ${min}' 확정`:"팀과 선수를 선택해주세요"}
      </button>
    </Modal>
  );
}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[{key:"home",info:match.home},{key:"away",info:match.away}].map(({key,info})=>(
            <button key={key} onClick={()=>{setTeam(key);setOut(null);}} style={{display:"flex",alignItems:"center",gap:8,background:team===key?`${info.color}20`:"#0f172a",border:`1px solid ${team===key?info.color:"#1e3060"}`,borderRadius:10,padding:"10px 12px",color:team===key?info.color:"#64748b",fontWeight:700,fontSize:16,cursor:"pointer"}}>
              <span style={{fontSize:22}}>{info.emoji}</span>{info.name}
            </button>
          ))}
        </div>
      </div>
      {/* 아웃 선수 */}
      {team&&(
        <div style={{marginBottom:12}}>
          <SL color="#ff7f7f">아웃 선수 *</SL>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:150,overflowY:"auto"}}>
            {players.map(p=>(
              <button key={p} onClick={()=>setOut(p)} style={{background:out===p?"rgba(255,71,87,.2)":"#0f172a",border:`1px solid ${out===p?"#ff4757":"#1e3060"}`,borderRadius:8,padding:"8px 10px",color:out===p?"#ff4757":"#94a3b8",fontWeight:out===p?700:400,fontSize:15,cursor:"pointer",textAlign:"left"}}>{p}</button>
            ))}
          </div>
        </div>
      )}
      {/* 인 선수 */}
      <div style={{marginBottom:12}}>
        <SL color="#2ecc71">인 선수 이름 *</SL>
        <input value={inP} onChange={e=>setInP(e.target.value)} placeholder="교체 들어오는 선수 이름"
          style={{width:"100%",background:"#0f172a",border:"1px solid #2ecc7150",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:17,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
      </div>
      {/* 비고 */}
      <div style={{marginBottom:18}}>
        <SL>비고 (선택)</SL>
        <input value={note} onChange={e=>setNote(e.target.value)} placeholder="부상, 전술적 교체..."
          style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:17,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
      </div>
      <button onClick={()=>ok&&onConfirm(team,out,inP.trim(),note,min)} style={{width:"100%",background:ok?"linear-gradient(135deg,#475569,#334155)":"#1e293b",border:"none",borderRadius:10,padding:"13px 0",color:ok?"#fff":"#475569",fontWeight:800,fontSize:18,cursor:ok?"pointer":"not-allowed"}}>
        {ok?`🔄 ${out} → ${inP} · ${min}' 확정`:"팀·아웃·인 선수를 모두 입력해주세요"}
      </button>
    </Modal>
  );
}


// ── 골 입력 모달 ──────────────────────────────────────────────────────────────
function GoalModal({ side, match, curMin, onConfirm, onClose }) {
  const info=match[side]; const l=match.lineup[side];
  const players=[...l.gk,...l.df,...l.mf,...l.fw];
  const [selP,setSelP]=useState(null); const [selA,setSelA]=useState("없음");
  const [selM,setSelM]=useState(null); const [min,setMin]=useState(curMin);
  const ok=selP&&selM;
  return (
    <Modal onClose={onClose} wide>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <span style={{fontSize:28}}>{info.emoji}</span>
        <div style={{fontSize:20,fontWeight:800,color:info.color}}>⚽ 골 등록 — {info.name}</div>
        <button onClick={onClose} style={{marginLeft:"auto",background:"rgba(255,255,255,.06)",border:"none",borderRadius:8,width:30,height:30,color:"#94a3b8",fontSize:20,cursor:"pointer"}}>✕</button>
      </div>
      <div style={{marginBottom:14}}>
        <SL>⏱ 발생 시간 (분)</SL>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setMin(m=>Math.max(1,m-1))} style={{width:34,height:34,borderRadius:8,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:22,cursor:"pointer"}}>−</button>
          <input type="number" min={1} max={90} value={min} onChange={e=>setMin(Math.max(1,Math.min(90,+e.target.value)))}
            style={{width:60,textAlign:"center",background:"#0f172a",border:"1px solid #2ecc71",borderRadius:8,padding:"6px 0",color:"#2ecc71",fontSize:22,fontWeight:900,outline:"none",fontFamily:"inherit"}}/>
          <span style={{color:"#64748b",fontSize:17}}>분</span>
          <button onClick={()=>setMin(m=>Math.min(90,m+1))} style={{width:34,height:34,borderRadius:8,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:22,cursor:"pointer"}}>+</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <div>
          <SL>⚽ 득점 선수 *</SL>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:180,overflowY:"auto"}}>
            {players.map(p=><button key={p} onClick={()=>{setSelP(p);if(selA===p)setSelA("없음");}} style={{background:selP===p?`${info.color}25`:"#0f172a",border:`1px solid ${selP===p?info.color:"#1e3060"}`,borderRadius:8,padding:"7px 8px",color:selP===p?info.color:"#94a3b8",fontWeight:selP===p?700:400,fontSize:15,cursor:"pointer",textAlign:"left"}}>{p}</button>)}
          </div>
        </div>
        <div>
          <SL>🤝 어시스트 (선택)</SL>
          <div style={{display:"grid",gridTemplateColumns:"1fr",gap:5,maxHeight:180,overflowY:"auto"}}>
            <button onClick={()=>setSelA("없음")} style={{background:selA==="없음"?"rgba(100,116,139,.25)":"#0f172a",border:`1px solid ${selA==="없음"?"#64748b":"#1e3060"}`,borderRadius:8,padding:"7px 8px",color:selA==="없음"?"#94a3b8":"#64748b",fontSize:15,cursor:"pointer",textAlign:"left"}}>없음</button>
            {players.filter(p=>p!==selP).map(p=><button key={p} onClick={()=>setSelA(p)} style={{background:selA===p?"rgba(52,152,219,.2)":"#0f172a",border:`1px solid ${selA===p?"#3498db":"#1e3060"}`,borderRadius:8,padding:"7px 8px",color:selA===p?"#3498db":"#94a3b8",fontSize:15,cursor:"pointer",textAlign:"left"}}>{p}</button>)}
          </div>
        </div>
      </div>
      <div style={{marginBottom:20}}>
        <SL>골 방식 *</SL>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {GOAL_METHODS.map(m=><button key={m} onClick={()=>setSelM(m)} style={{background:selM===m?"rgba(46,204,113,.2)":"#0f172a",border:`1px solid ${selM===m?"#2ecc71":"#1e3060"}`,borderRadius:8,padding:"8px 14px",color:selM===m?"#2ecc71":"#64748b",fontSize:16,fontWeight:selM===m?700:400,cursor:"pointer"}}>{m}</button>)}
        </div>
      </div>
      <button onClick={()=>ok&&onConfirm(selP,selA==="없음"?"":selA,selM,min)} style={{width:"100%",background:ok?`linear-gradient(135deg,${info.color},${info.color}bb)`:"#1e293b",border:"none",borderRadius:10,padding:"13px 0",color:ok?"#fff":"#475569",fontWeight:800,fontSize:18,cursor:ok?"pointer":"not-allowed"}}>
        {ok?`⚽ ${selP}${selA&&selA!=="없음"?" 🤝"+selA:""} · ${selM} · ${min}' 확정`:"득점 선수와 방식을 선택해주세요"}
      </button>
    </Modal>
  );
}

// ── 경기 상세 (기록 담당자용) ─────────────────────────────────────────────────
function MatchDetail({ matchId, matches, onUpdateMatch, onBack, adminName }) {
  const match = matches.find(m=>m.id===matchId);
  const [modal,  setModal]  = useState(null);
  const [notif,  setNotif]  = useState(null);
  const [tab,    setTab]    = useState("timeline");
  // 타이머는 AdminApp 전역 타이머가 담당 (이중 타이머 방지)
  const update = useCallback(upd=>onUpdateMatch(matchId,typeof upd==="function"?upd(match):upd),[match,matchId,onUpdateMatch]);

  if(!match) return null;

  const phase=match.phase||"pre"; const elSec=match.elapsedSec||0;
  const isFirst=phase==="first_half"; const isSecond=phase==="second_half";
  const isHalf=phase==="half_time"; const isRunning=isFirst||isSecond;
  const isPre=phase==="pre"; const isFinished=phase==="finished";
  const halfDur=match.halfDuration??(match.group==="B"?15:10);
  const fullDur=halfDur*2;
  const extraFirst=match.extraFirst||0; const extraSecond=match.extraSecond||0;
  const dSec=isSecond?(elSec-(match.firstHalfSec||0)):elSec;
  const rawMin=isSecond?Math.floor(dSec/60)+halfDur+1:Math.floor(elSec/60)+1;
  const capMin=isFirst?Math.min(halfDur,rawMin):isSecond?Math.min(fullDur,rawMin):rawMin;
  const extMin=isFirst?(rawMin>halfDur?rawMin-halfDur:0):isSecond?(rawMin>fullDur?rawMin-fullDur:0):0;
  const dStr=isHalf?"HT":isFinished?"FT":isRunning?(extMin>0?`${capMin}+${extMin}'${pad(dSec%60)}`:`${capMin}'${pad(dSec%60)}`):"--";
  const curMin=isRunning?(extMin>0?capMin+extMin:capMin):1;

  const showN=(msg,c="#2ecc71")=>{setNotif({msg,color:c});setTimeout(()=>setNotif(null),2200);};

  const goPhase=(next,msg,c="#2ecc71")=>{
    const upd={phase:next};
    if(next==="half_time"){upd.firstHalfSec=elSec;upd.status="진행중";}
    if(next==="second_half"){upd.status="진행중";}
    if(next==="first_half"){upd.status="진행중";upd.hs=match.hs??0;upd.as=match.as??0;}
    if(next==="finished"){upd.status="완료";}
    update(prev=>({...prev,...upd}));
    showN(msg,c);
  };
  const addGoal=(side,player,assist,method,min)=>{
    const sk=side==="home"?"hs":"as";
    update(prev=>({...prev,[sk]:(prev[sk]||0)+1,events:[...prev.events,{id:Date.now(),min,type:"goal",team:side,player,assist:assist||"",desc:method}]}));
    setModal(null); showN(`⚽ ${player}${assist?" 🤝"+assist:""} · ${method} · ${min}'`);
  };
  const addCard=(type,team,player,reason,min)=>{
    update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type,team,player,assist:"",desc:reason}]}));
    setModal(null); showN(`${type==="yellow"?"🟨":"🟥"} ${player} · ${min}'`);
  };
  const cancelGoal=(id)=>{
    const ev=match.events.find(e=>e.id===id); if(!ev) return;
    update(prev=>({...prev,[ev.team==="home"?"hs":"as"]:Math.max(0,(prev[ev.team==="home"?"hs":"as"]||0)-1),events:prev.events.filter(e=>e.id!==id)}));
    setModal(null); showN("🚫 골 취소","#ff4757");
  };

  return (
    <div style={{background:"#020817",minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:"#e2e8f0"}}>
      <Notif n={notif}/>
      {modal==="goal_home"&&<GoalModal side="home" match={match} curMin={curMin} onConfirm={(p,a,m,mn)=>addGoal("home",p,a,m,mn)} onClose={()=>setModal(null)}/>}
      {modal==="goal_away"&&<GoalModal side="away" match={match} curMin={curMin} onConfirm={(p,a,m,mn)=>addGoal("away",p,a,m,mn)} onClose={()=>setModal(null)}/>}
      {(modal==="yellow"||modal==="red")&&<CardEventModal type={modal} match={match} curMin={curMin} onConfirm={(team,player,reason,min)=>{addCard(modal,team,player,reason,min);}} onClose={()=>setModal(null)}/>}
      {modal==="sub"&&<SubEventModal match={match} curMin={curMin} onConfirm={(team,out,inP,note,min)=>{update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type:"sub",team,player:`${out}→${inP}`,assist:"",desc:note||"선수 교체"}]}));setModal(null);showN(`🔄 ${out}→${inP} · ${min}'`);}} onClose={()=>setModal(null)}/>}
      {modal==="cancel"&&(
        <Modal onClose={()=>setModal(null)}>
          <div style={{fontSize:19,fontWeight:800,color:"#ff4757",marginBottom:14}}>🚫 골 취소</div>
          {match.events.filter(e=>e.type==="goal").length===0
            ?<div style={{textAlign:"center",padding:"20px 0",color:"#475569"}}>취소할 골이 없습니다</div>
            :match.events.filter(e=>e.type==="goal").map(e=>(
              <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,71,87,.06)",border:"1px solid #ff475720",borderRadius:10,padding:"10px 14px",marginBottom:7}}>
                <span>⚽</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:17,fontWeight:700}}>{e.player}{e.assist?<span style={{color:"#3498db"}}> 🤝{e.assist}</span>:""}</div>
                  <div style={{fontSize:15,color:"#475569"}}>{e.desc} · {e.min}' · {e.team==="home"?match.home.name:match.away.name}</div>
                </div>
                <button onClick={()=>cancelGoal(e.id)} style={{background:"#ff4757",border:"none",borderRadius:7,padding:"6px 12px",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>취소</button>
              </div>
            ))}
        </Modal>
      )}

      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#0d1b3e,#1a2a5e)",borderBottom:"1px solid #1e3060",padding:"14px 20px",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:9,width:34,height:34,color:"#e2e8f0",fontSize:22,cursor:"pointer"}}>←</button>
          <div style={{flex:1,fontSize:15,color:"#64748b",textAlign:"center"}}>{match.date} · {match.time} · {match.field} · {match.group}조 · {halfDur}분</div>
          <div style={{background:"rgba(241,196,15,.15)",border:"1px solid #f1c40f40",borderRadius:20,padding:"3px 10px",fontSize:14,fontWeight:700,color:"#f1c40f"}}>📝 {adminName}</div>
        </div>
        {/* 스코어 */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0"}}>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:32}}>{match.home.emoji}</div>
            <div style={{fontSize:17,fontWeight:800,marginTop:4,color:"#e2e8f0"}}>{match.home.name}</div>
          </div>
          <div style={{textAlign:"center",padding:"0 12px"}}>
            {isPre
              ?<div style={{fontSize:26,fontWeight:900,color:"#64748b"}}>VS</div>
              :<div>
                <div style={{fontSize:48,fontWeight:900,letterSpacing:6,fontVariantNumeric:"tabular-nums"}}>
                  <span style={{color:(match.hs||0)>(match.as||0)?"#e2e8f0":"#64748b"}}>{match.hs??0}</span>
                  <span style={{color:"#2ecc71",fontSize:26,margin:"0 4px"}}>:</span>
                  <span style={{color:(match.as||0)>(match.hs||0)?"#e2e8f0":"#64748b"}}>{match.as??0}</span>
                </div>
                <div style={{fontSize:14,color:extMin>0?"#f1c40f":PHASE_COLOR[phase],fontVariantNumeric:"tabular-nums",fontWeight:900,marginTop:2}}>{dStr}</div>
              </div>
            }
          </div>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:32}}>{match.away.emoji}</div>
            <div style={{fontSize:17,fontWeight:800,marginTop:4,color:"#e2e8f0"}}>{match.away.name}</div>
          </div>
        </div>
        {/* 탭 */}
        <div style={{display:"flex",borderTop:"1px solid #1e3060",marginTop:10}}>
          {["타임라인","통계"].map((t,i)=>{const k=["timeline","stats"][i];return<button key={t} onClick={()=>setTab(k)} style={{flex:1,padding:"10px 0",border:"none",background:"transparent",cursor:"pointer",fontSize:16,fontWeight:tab===k?800:500,color:tab===k?"#2ecc71":"#64748b",borderBottom:tab===k?"2px solid #2ecc71":"2px solid transparent"}}>{t}</button>;})}
        </div>
      </div>

      <div style={{padding:"16px 16px 80px",maxWidth:600,margin:"0 auto"}}>
        {tab==="timeline"&&(
          <div>
            {/* 진행 관리 */}
            <div style={{background:"#0a1428",border:"1px solid #1e3060",borderRadius:14,padding:14,marginBottom:12}}>
              <div style={{fontSize:15,fontWeight:700,color:"#7b9bc8",marginBottom:10,letterSpacing:1}}>🎮 경기 진행 관리</div>
              {isPre&&(
                <div style={{background:"rgba(59,130,246,.07)",border:"1px solid #3b82f620",borderRadius:10,padding:12,marginBottom:10}}>
                  <div style={{fontSize:14,color:"#60a5fa",fontWeight:700,marginBottom:8}}>📅 일정 수정</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div><div style={{fontSize:13,color:"#475569",marginBottom:4}}>날짜</div><input value={match.date} onChange={e=>update(p=>({...p,date:e.target.value}))} style={{width:"100%",background:"#0f172a",border:"1px solid #3b82f640",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:16,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/></div>
                    <div><div style={{fontSize:13,color:"#475569",marginBottom:4}}>시간</div><input value={match.time} onChange={e=>update(p=>({...p,time:e.target.value}))} style={{width:"100%",background:"#0f172a",border:"1px solid #3b82f640",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:16,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/></div>
                  </div>
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:14,color:"#2ecc71",fontWeight:700,marginBottom:8}}>⏱ 러닝타임</div>
                    <div style={{display:"flex",gap:6,marginBottom:8}}>
                      {[{l:"U-11 10분",v:10,c:"#e74c3c"},{l:"U-9 15분",v:15,c:"#2ecc71"},{l:"U-13 10분",v:10,c:"#8e44ad"}].map(p=>(
                        <button key={p.l} onClick={()=>update(prev=>({...prev,halfDuration:p.v}))} style={{flex:1,background:halfDur===p.v?`${p.c}20`:"#0f172a",border:`1px solid ${halfDur===p.v?p.c:"#1e3060"}`,borderRadius:7,padding:"7px 4px",color:halfDur===p.v?p.c:"#64748b",fontWeight:halfDur===p.v?700:400,fontSize:14,cursor:"pointer"}}>{p.l}</button>
                      ))}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <button onClick={()=>update(p=>({...p,halfDuration:Math.max(5,halfDur-1)}))} style={{width:32,height:32,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:20,cursor:"pointer"}}>−</button>
                      <div style={{flex:1,textAlign:"center"}}><span style={{fontSize:26,fontWeight:900,color:"#2ecc71"}}>{halfDur}</span><span style={{fontSize:16,color:"#64748b",marginLeft:4}}>분 (전후반 각)</span></div>
                      <button onClick={()=>update(p=>({...p,halfDuration:Math.min(30,halfDur+1)}))} style={{width:32,height:32,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:20,cursor:"pointer"}}>+</button>
                    </div>
                  </div>
                </div>
              )}
              {/* 타이머 표시 */}
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"12px 14px",background:"rgba(0,0,0,.3)",borderRadius:10,border:`1px solid ${PHASE_COLOR[phase]}30`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:PHASE_COLOR[phase],flexShrink:0,animation:isRunning?"blink 1s infinite":"none"}}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:15,color:PHASE_COLOR[phase],fontWeight:700}}>{PHASE_LABEL[phase]}</div>
                  {(isRunning||isPre)&&<div style={{fontSize:13,color:"#475569",marginTop:1}}>전후반 각 {halfDur}분{extMin>0?" · 추가시간":""}</div>}
                </div>
                <div style={{fontSize:32,fontWeight:900,color:extMin>0?"#f1c40f":PHASE_COLOR[phase],fontVariantNumeric:"tabular-nums",letterSpacing:-1}}>{dStr}</div>
              </div>
              {/* 추가시간 */}
              {(isFirst||isSecond)&&(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:6}}>{isFirst?"전반":"후반"} 추가시간</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(241,196,15,.06)",border:"1px solid #f1c40f20",borderRadius:9,padding:"9px 12px"}}>
                    <button onClick={()=>update(p=>({...p,[isFirst?"extraFirst":"extraSecond"]:Math.max(0,(isFirst?extraFirst:extraSecond)-1)}))} style={{width:28,height:28,borderRadius:6,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:18,cursor:"pointer"}}>−</button>
                    <div style={{flex:1,textAlign:"center"}}><span style={{fontSize:24,fontWeight:900,color:"#f1c40f"}}>{isFirst?extraFirst:extraSecond}</span><span style={{fontSize:15,color:"#64748b",marginLeft:4}}>분</span></div>
                    <button onClick={()=>update(p=>({...p,[isFirst?"extraFirst":"extraSecond"]:Math.min(15,(isFirst?extraFirst:extraSecond)+1)}))} style={{width:28,height:28,borderRadius:6,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:18,cursor:"pointer"}}>+</button>
                  </div>
                </div>
              )}
              {/* 단계 버튼 */}
              {isPre&&<button onClick={()=>goPhase("first_half","▶ 경기 시작!")} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"13px 0",color:"#000",fontWeight:800,fontSize:18,cursor:"pointer"}}>▶ 경기 시작 (전반 {halfDur}분)</button>}
              {isFirst&&<button onClick={()=>goPhase("half_time","⏸ 전반 종료","#f1c40f")} style={{width:"100%",background:"linear-gradient(135deg,#f1c40f,#d4ac0d)",border:"none",borderRadius:10,padding:"12px 0",color:"#000",fontWeight:800,fontSize:18,cursor:"pointer"}}>⏸ 전반 종료{extraFirst>0?` (+${extraFirst}분)`:""}</button>}
              {isHalf&&<button onClick={()=>goPhase("second_half","▶ 후반 시작!")} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"12px 0",color:"#000",fontWeight:800,fontSize:18,cursor:"pointer"}}>▶ 후반 시작 (후반 {halfDur}분)</button>}
              {isSecond&&<button onClick={()=>goPhase("finished","🏁 경기 종료!","#ff4757")} style={{width:"100%",background:"linear-gradient(135deg,#ff4757,#c0392b)",border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:18,cursor:"pointer"}}>🏁 경기 종료{extraSecond>0?` (+${extraSecond}분)`:""}</button>}
              {isFinished&&<div style={{textAlign:"center",padding:"8px 0",fontSize:16,color:"#64748b"}}>경기 종료 (전후반 {halfDur}분)</div>}
            </div>

            {/* 이벤트 입력 */}
            {isRunning&&(
              <div style={{background:"#0f172a",border:"2px solid #f1c40f",borderRadius:14,padding:14,marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                  <span style={{fontSize:15,fontWeight:800,color:"#f1c40f"}}>📝 이벤트 입력</span>
                  <button onClick={()=>setModal("cancel")} style={{marginLeft:"auto",background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:20,padding:"4px 12px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>🚫 골 취소</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                  <button onClick={()=>setModal("goal_home")} style={{background:`linear-gradient(135deg,${match.home.color},${match.home.color}bb)`,border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:17,cursor:"pointer"}}>⚽ {match.home.emoji} 홈 골</button>
                  <button onClick={()=>setModal("goal_away")} style={{background:`linear-gradient(135deg,${match.away.color},${match.away.color}bb)`,border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:17,cursor:"pointer"}}>⚽ {match.away.emoji} 원정 골</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                  <button onClick={()=>setModal("yellow")} style={{background:"rgba(241,196,15,.12)",border:"1px solid #f1c40f40",borderRadius:8,padding:"9px 4px",color:"#f1c40f",fontWeight:700,fontSize:15,cursor:"pointer"}}>🟨 옐로</button>
                  <button onClick={()=>setModal("red")}    style={{background:"rgba(231,76,60,.12)",border:"1px solid #e74c3c40",borderRadius:8,padding:"9px 4px",color:"#e74c3c",fontWeight:700,fontSize:15,cursor:"pointer"}}>🟥 레드</button>
                  <button onClick={()=>setModal("sub")}    style={{background:"rgba(148,163,184,.1)",border:"1px solid #94a3b840",borderRadius:8,padding:"9px 4px",color:"#94a3b8",fontWeight:700,fontSize:15,cursor:"pointer"}}>🔄 교체</button>
                </div>
              </div>
            )}

            {/* 이벤트 로그 */}
            {!isPre&&(
              <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:14,padding:14}}>
                <div style={{fontSize:15,fontWeight:700,color:"#475569",marginBottom:10}}>이벤트 로그</div>
                {match.events.length===0
                  ?<div style={{textAlign:"center",padding:"16px 0",color:"#334155",fontSize:16}}>기록된 이벤트가 없습니다</div>
                  :[...match.events].reverse().map(e=>{
                    const icon={goal:"⚽",yellow:"🟨",red:"🟥",sub:"🔄"}[e.type]||"●";
                    const isH=e.team==="home";
                    return <div key={e.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #1e293b"}}>
                      <span style={{fontSize:14,fontWeight:700,background:"rgba(46,204,113,.12)",color:"#2ecc71",padding:"2px 6px",borderRadius:5,minWidth:26,textAlign:"center"}}>{e.min}'</span>
                      <span style={{fontSize:18}}>{icon}</span>
                      <span style={{fontSize:15,color:isH?match.home.color:match.away.color,fontWeight:600}}>{isH?match.home.name:match.away.name}</span>
                      <span style={{fontSize:15,color:"#e2e8f0"}}>{e.player}{e.assist?<span style={{color:"#3498db"}}> 🤝{e.assist}</span>:""}</span>
                      <span style={{fontSize:14,color:"#475569"}}>{e.desc}</span>
                    </div>;
                  })
                }
              </div>
            )}
          </div>
        )}
        {tab==="stats"&&(
          <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:14,padding:16}}>
            {isPre?<div style={{textAlign:"center",padding:"28px 0",color:"#475569"}}>경기 시작 후 통계가 표시됩니다</div>:(
              <div>
                <div style={{marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontWeight:900,fontSize:22,color:match.home.color}}>{match.stats.possession[0]}%</span><span style={{fontSize:15,color:"#64748b"}}>점유율</span><span style={{fontWeight:900,fontSize:22,color:match.away.color}}>{match.stats.possession[1]}%</span></div>
                  <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden"}}><div style={{flex:match.stats.possession[0],background:match.home.color}}/><div style={{flex:match.stats.possession[1],background:match.away.color}}/></div>
                </div>
                {[["슈팅","shots"],["유효슈팅","shotsOnTarget"],["코너킥","corners"],["파울","fouls"]].map(([label,k])=>{
                  const h=match.stats[k][0],a=match.stats[k][1],tot=h+a||1;
                  return <div key={k} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:17}}><span style={{fontWeight:700,color:"#e2e8f0"}}>{h}</span><span style={{color:"#64748b",fontSize:15}}>{label}</span><span style={{fontWeight:700,color:"#e2e8f0"}}>{a}</span></div>
                    <div style={{display:"flex",height:5,borderRadius:4,overflow:"hidden"}}><div style={{flex:Math.round(h/tot*100),background:"#3b82f6"}}/><div style={{flex:Math.round(a/tot*100),background:"#e74c3c"}}/></div>
                  </div>;
                })}
              </div>
            )}
          </div>
        )}
      </div>
      <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
    </div>
  );
}

// ── 기록 담당자 메인 앱 ───────────────────────────────────────────────────────
function AdminApp({ admin, onLogout }) {
  const [tab,      setTab]      = useState("schedule");
  const [matches,  setMatches]  = useState(INIT_MATCHES);
  const [fbReady,  setFbReady]  = useState(false);
  const [detailId, setDetailId] = useState(null);
  const [notif,    setNotif]    = useState(null);
  const [showLogout, setShowLogout] = useState(false);

  // Firebase 실시간 리스너
  useEffect(()=>{
    const unsub = FB.watchMatches(list=>{
      setMatches(list.length>0 ? list : INIT_MATCHES);
      setFbReady(true);
    });
    return ()=>unsub();
  },[]);

  // 전체 경기 타이머
  useEffect(()=>{
    const iv=setInterval(()=>{
      setMatches(prev=>prev.map(m=>(m.phase==="first_half"||m.phase==="second_half")?{...m,elapsedSec:(m.elapsedSec||0)+1}:m));
    },1000);
    return ()=>clearInterval(iv);
  },[]);

  const showNotif=(msg,color="#2ecc71")=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2400);};
  const updateMatch=(id,upd)=>setMatches(prev=>{
    const next=prev.map(m=>m.id===id?(typeof upd==="function"?upd(m):{...m,...upd}):m);
    FB.saveMatches(next).catch(()=>{});
    return next;
  });
  const liveCount=matches.filter(m=>m.phase==="first_half"||m.phase==="second_half").length;

  if(detailId!=null) return <MatchDetail matchId={detailId} matches={matches} onUpdateMatch={updateMatch} onBack={()=>setDetailId(null)} adminName={admin.name}/>;

  const navTabs=[
    {id:"schedule",icon:"📅",label:"일정"},
    {id:"stats",   icon:"📊",label:"통계"},
  ];

  const groupInfo={A:{label:"A조·U-11·제1구장",color:"#e74c3c"},B:{label:"B조·U-9·제2구장",color:"#2ecc71"},C:{label:"C조·U-13·제2구장",color:"#8e44ad"}};

  // 조별 순위 계산
  const calcGroup=(grp)=>{
    const tMap={};
    matches.filter(m=>m.group===grp).forEach(m=>{
      [m.home.name,m.away.name].forEach(name=>{
        const t=name===m.home.name?m.home:m.away;
        if(!tMap[name]) tMap[name]={name,emoji:t.emoji,color:t.color,p:0,w:0,d:0,l:0,gf:0,ga:0};
      });
      if(m.phase!=="finished") return;
      const h=tMap[m.home.name]; const a=tMap[m.away.name];
      h.p++;a.p++; const hs=m.hs||0; const as=m.as||0;
      h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
      if(hs>as){h.w++;a.l++;}else if(hs<as){a.w++;h.l++;}else{h.d++;a.d++;}
    });
    return Object.values(tMap).sort((a,b)=>{const pa=a.w*3+a.d,pb=b.w*3+b.d;return pb-pa||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
  };

  // 통계 집계
  const allEvents=matches.flatMap(m=>m.events.map(e=>({...e,home:m.home,away:m.away,grp:m.group})));
  const goals=allEvents.filter(e=>e.type==="goal");
  const yellows=allEvents.filter(e=>e.type==="yellow");
  const pMap={};
  goals.forEach(e=>{
    const tn=e.team==="home"?e.home.name:e.away.name;
    if(!pMap[e.player]) pMap[e.player]={name:e.player,team:tn,group:e.grp,goals:0,assists:0};
    pMap[e.player].goals++;
    if(e.assist){if(!pMap[e.assist]) pMap[e.assist]={name:e.assist,team:tn,group:e.grp,goals:0,assists:0};pMap[e.assist].assists++;}
  });
  const scorers=Object.values(pMap).filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);

  // 경기 카드
  const MatchCard=({m})=>{
    const phase=m.phase||"pre"; const elSec=m.elapsedSec||0;
    const halfDur=m.halfDuration??(m.group==="B"?15:10); const fullDur=halfDur*2;
    const isRunning=phase==="first_half"||phase==="second_half"; const isHalf=phase==="half_time";
    const dSec=phase==="second_half"?(elSec-(m.firstHalfSec||0)):elSec;
    const rawMin=phase==="second_half"?Math.floor(dSec/60)+halfDur+1:Math.floor(elSec/60)+1;
    const capMin=phase==="second_half"?Math.min(fullDur,rawMin):Math.min(halfDur,rawMin);
    const extMin=phase==="second_half"?(rawMin>fullDur?rawMin-fullDur:0):(rawMin>halfDur?rawMin-halfDur:0);
    const timeStr=extMin>0?`${capMin}+${extMin}'${pad(dSec%60)}`:`${capMin}'${pad(dSec%60)}`;
    const liveStr=isRunning?`${PHASE_LABEL[phase]} · ${timeStr}`:isHalf?"HT":m.status;
    const st=STATUS_STYLE[m.status]||STATUS_STYLE["예정"];
    const gc=groupInfo[m.group];
    return (
      <div style={{background:"#0f1d35",border:`1px solid ${isRunning?"#2ecc71":"#1e3060"}`,borderRadius:14,padding:14,marginBottom:10,boxShadow:isRunning?"0 0 16px rgba(46,204,113,.12)":"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:13,fontWeight:700,background:`${gc?.color}20`,color:gc?.color,padding:"2px 7px",borderRadius:10}}>{m.group}조</span>
            <span style={{fontSize:15,color:"#64748b"}}>🕐 {m.time} · {m.field} · {halfDur}분</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            {isRunning&&<span style={{width:6,height:6,borderRadius:"50%",background:"#2ecc71",display:"inline-block",animation:"blink 1s infinite"}}/>}
            <span style={{fontSize:14,fontWeight:700,padding:"3px 9px",borderRadius:20,background:st.bg,color:st.text,fontVariantNumeric:"tabular-nums"}}>{liveStr}</span>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:26}}>{m.home.emoji}</span>
            <div><div style={{fontSize:17,fontWeight:700,color:"#e2e8f0"}}>{m.home.name}</div>
              {m.events?.filter(e=>e.type==="goal"&&e.team==="home").map(e=><div key={e.id} style={{fontSize:13,color:"#64748b"}}>{e.player} {e.min}'</div>)}
            </div>
          </div>
          <div style={{textAlign:"center",padding:"0 10px"}}>
            {m.hs!==null?<div style={{fontSize:26,fontWeight:900,color:isRunning?"#2ecc71":"#e2e8f0"}}>{m.hs??0} : {m.as??0}</div>:<div style={{fontSize:17,color:"#64748b"}}>VS</div>}
          </div>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end",textAlign:"right"}}>
            <div><div style={{fontSize:17,fontWeight:700,color:"#e2e8f0"}}>{m.away.name}</div>
              {m.events?.filter(e=>e.type==="goal"&&e.team==="away").map(e=><div key={e.id} style={{fontSize:13,color:"#64748b"}}>{e.player} {e.min}'</div>)}
            </div>
            <span style={{fontSize:26}}>{m.away.emoji}</span>
          </div>
        </div>
        <div style={{marginTop:10,display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>setDetailId(m.id)} style={{background:"linear-gradient(135deg,#f1c40f,#d4ac0d)",border:"none",borderRadius:8,padding:"7px 14px",color:"#000",fontWeight:800,fontSize:15,cursor:"pointer"}}>📝 기록 입력</button>
        </div>
      </div>
    );
  };

  return (
    <div style={{fontFamily:"'Noto Sans KR',sans-serif",background:"#0a0e1a",minHeight:"100vh",color:"#e8eaf0",maxWidth:480,margin:"0 auto"}}>
      <Notif n={notif}/>

      {showLogout&&(
        <Modal onClose={()=>setShowLogout(false)}>
          <div style={{textAlign:"center",padding:"8px 0 20px"}}>
            <div style={{fontSize:36,marginBottom:12}}>📝</div>
            <div style={{fontSize:19,fontWeight:800,color:"#e2e8f0",marginBottom:6}}>로그아웃 하시겠습니까?</div>
            <div style={{fontSize:16,color:"#64748b",marginBottom:20}}><strong style={{color:"#f1c40f"}}>{admin.name}</strong> 기록 담당자</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <button onClick={()=>setShowLogout(false)} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"12px 0",color:"#94a3b8",fontWeight:700,fontSize:17,cursor:"pointer"}}>취소</button>
              <button onClick={onLogout} style={{background:"linear-gradient(135deg,#ff4757,#c0392b)",border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:17,cursor:"pointer"}}>로그아웃</button>
            </div>
          </div>
        </Modal>
      )}

      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#0d1b3e,#1a2a5e)",padding:"14px 16px 12px",borderBottom:"1px solid #1e3060",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#f1c40f,#d4ac0d)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📝</div>
          <div>
            <div style={{fontSize:17,fontWeight:800}}>26년 상반기 은하수대회</div>
            <div style={{fontSize:13,color:"#7b9bc8",marginTop:1}}>기록 담당자 · {admin.name}</div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:7}}>
            {liveCount>0&&<div style={{background:"#ff4757",color:"#fff",fontSize:13,fontWeight:800,padding:"2px 7px",borderRadius:20,animation:"blink 1.5s infinite"}}>LIVE {liveCount}</div>}
            <button onClick={()=>setShowLogout(true)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475730",borderRadius:20,padding:"4px 10px",color:"#ff4757",fontSize:14,fontWeight:600,cursor:"pointer"}}>로그아웃</button>
          </div>
        </div>
      </div>

      <div style={{padding:"16px 16px 80px"}}>
        {/* 일정 탭 */}
        {tab==="schedule"&&(
          <div>
            <div style={{fontSize:19,fontWeight:800,marginBottom:14}}>경기 일정 · 기록 입력</div>
            {["A","B","C"].map(grp=>{
              const gm=matches.filter(m=>m.group===grp);
              const gi=groupInfo[grp];
              return (
                <div key={grp} style={{marginBottom:20}}>
                  <div style={{fontSize:15,fontWeight:700,color:gi?.color,marginBottom:10,letterSpacing:1}}>{gi?.label}</div>
                  {gm.map(m=><MatchCard key={m.id} m={m}/>)}
                </div>
              );
            })}
          </div>
        )}

        {/* 통계 탭 */}
        {tab==="stats"&&(
          <div>
            <div style={{fontSize:19,fontWeight:800,marginBottom:14}}>기록 통계</div>
            {/* KPI */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:20}}>
              {[{icon:"🏆",label:"완료",value:matches.filter(m=>m.phase==="finished").length,color:"#60a5fa"},{icon:"⚽",label:"총 득점",value:goals.length,color:"#2ecc71"},{icon:"🟨",label:"카드",value:yellows.length,color:"#f1c40f"}].map(k=>(
                <div key={k.label} style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:12,padding:14,textAlign:"center"}}>
                  <div style={{fontSize:22,marginBottom:3}}>{k.icon}</div>
                  <div style={{fontSize:26,fontWeight:900,color:k.color}}>{k.value}</div>
                  <div style={{fontSize:14,color:"#475569",marginTop:2}}>{k.label}</div>
                </div>
              ))}
            </div>
            {/* 조별 순위 */}
            {["A","B","C"].map(grp=>{
              const teams=calcGroup(grp); const gi=groupInfo[grp];
              return (
                <div key={grp} style={{marginBottom:16}}>
                  <div style={{fontSize:15,fontWeight:700,color:gi?.color,marginBottom:8,letterSpacing:1}}>{grp}조 순위</div>
                  <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
                    <div style={{display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 36px",padding:"7px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:3}}>
                      {["","팀","경","승","무","패","득실","승점"].map(h=><div key={h}>{h}</div>)}
                    </div>
                    {teams.length===0?<div style={{padding:"12px",textAlign:"center",fontSize:15,color:"#334155"}}>경기 대기</div>:
                      teams.map((t,i)=>{
                        const pts=t.w*3+t.d;
                        return <div key={t.name} style={{display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 36px",padding:"8px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:3}}>
                          <div style={{textAlign:"center",fontSize:16}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":<span style={{color:"#334155"}}>{i+1}</span>}</div>
                          <div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:17}}>{t.emoji}</span><span style={{fontSize:16,fontWeight:i<2?700:500,color:i<2?"#e2e8f0":"#94a3b8"}}>{t.name}</span></div>
                          <div style={{textAlign:"center",fontSize:15,color:"#64748b"}}>{t.p}</div>
                          <div style={{textAlign:"center",fontSize:15,color:"#2ecc71",fontWeight:700}}>{t.w}</div>
                          <div style={{textAlign:"center",fontSize:15,color:"#94a3b8"}}>{t.d}</div>
                          <div style={{textAlign:"center",fontSize:15,color:"#ff4757",fontWeight:700}}>{t.l}</div>
                          <div style={{textAlign:"center",fontSize:15,color:"#e2e8f0"}}>{t.gf-t.ga>0?"+":""}{t.gf-t.ga}</div>
                          <div style={{textAlign:"center",fontSize:18,fontWeight:900,color:i===0?"#f1c40f":"#e2e8f0"}}>{pts}</div>
                        </div>;
                      })
                    }
                  </div>
                </div>
              );
            })}
            {/* 득점 순위 */}
            <div style={{fontSize:15,fontWeight:700,color:"#475569",marginBottom:8,letterSpacing:1}}>득점 순위</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
              {scorers.length===0?<div style={{padding:"16px",textAlign:"center",fontSize:16,color:"#334155"}}>기록 없음</div>:
                scorers.slice(0,10).map((p,i)=>(
                  <div key={p.name} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderBottom:"1px solid #1e3060"}}>
                    <span style={{fontSize:15,fontWeight:800,color:i===0?"#f1c40f":i===1?"#94a3b8":i===2?"#cd7f32":"#334155",minWidth:18,textAlign:"center"}}>{i+1}</span>
                    <span style={{fontSize:17,fontWeight:600,color:"#e2e8f0",flex:1}}>{p.name}</span>
                    <span style={{fontSize:14,color:"#475569"}}>{p.team} · {p.group}조</span>
                    <span style={{fontSize:18,fontWeight:900,color:"#2ecc71"}}>{p.goals}<span style={{fontSize:13,color:"#475569",marginLeft:2}}>골</span></span>
                    <span style={{fontSize:17,fontWeight:700,color:"#3498db"}}>{p.assists}<span style={{fontSize:13,color:"#475569",marginLeft:2}}>도</span></span>
                  </div>
                ))
              }
            </div>
          </div>
        )}
      </div>

      {/* 하단 내비 */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#0a0e1a",borderTop:"1px solid #1e3060",display:"flex",padding:"8px 0 12px"}}>
        {navTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",padding:"4px 0"}}>
            <span style={{fontSize:24}}>{t.icon}</span>
            <span style={{fontSize:13,fontWeight:tab===t.id?700:400,color:tab===t.id?"#f1c40f":"#4a6080"}}>{t.label}</span>
            {tab===t.id&&<div style={{width:4,height:4,borderRadius:"50%",background:"#f1c40f"}}/>}
          </button>
        ))}
      </div>

      <style>{`
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        input::placeholder{color:#2a3a5a;}
        *{-webkit-tap-highlight-color:transparent;}
        input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
      `}</style>
    </div>
  );
}

// ── 메인 진입점 ───────────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(()=>STORAGE.getSession());
  const [notif,   setNotif]   = useState(null);
  const showNotif=(msg,c="#2ecc71")=>{setNotif({msg,color:c});setTimeout(()=>setNotif(null),2400);};

  const handleLogin = (adminObj) => {
    STORAGE.setSession(adminObj);
    setSession(adminObj);
  };
  const handleLogout = () => {
    STORAGE.clearSession();
    setSession(null);
  };

  if(!session) return <LoginPage onLogin={handleLogin}/>;

  if(session.isMaster) return <MasterPanel onLogout={handleLogout} showNotif={showNotif}/>;

  return <AdminApp admin={session} onLogout={handleLogout}/>;
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
