// Imgur 업로드
const uploadImage=async(file)=>{
  if(!file)return null;
  if(file.size>5*1024*1024)throw new Error("5MB 이하만 가능합니다");
  const allowed=["image/jpeg","image/png","image/gif","image/webp"];
  if(!allowed.includes(file.type))throw new Error("JPG/PNG/GIF/WEBP만 가능합니다");
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const MAX=800; let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.75));
      };
      img.onerror=()=>reject(new Error("이미지 로드 실패"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("파일 읽기 실패"));
    reader.readAsDataURL(file);
  });
};

function Modal({onClose,children,wide}){

      </div>
    </div>
  );
}
function Inp({value,onChange,placeholder,type="text",style:st}){
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
    style={{width:"100%",background:"#f8fafc",border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 14px",color:C.text,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit",...st}}/>;
}
function Label({children}){
  return <div style={{fontSize:13,fontWeight:600,color:C.sub,marginBottom:6}}>{children}</div>;
}
function Btn({onClick,color="primary",children,style:st,disabled}){
  const bg={primary:C.primary,success:C.success,danger:C.danger,warning:C.warning,ghost:"#f1f5f9"}[color];
  const tc=color==="ghost"?C.sub:"#fff";
  return <button onClick={onClick} disabled={disabled}
    style={{background:bg,border:"none",borderRadius:10,padding:"11px 0",color:tc,fontWeight:800,fontSize:15,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,...st}}>{children}</button>;
}

// ── 회원가입 ─────────────────────────────────────────────────────────────────
function RegisterPage({onBack}){
  const [form,setForm]=useState({name:"",email:"",pw:"",pw2:""});
  const [err,setErr]=useState(""); const [done,setDone]=useState(false);
  const handle=()=>{
    const {name,email,pw,pw2}=form;
    if(!name.trim()||!email.trim()||!pw||!pw2){setErr("모든 항목을 입력해주세요.");return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setErr("이메일 형식이 올바르지 않습니다.");return;}
    if(pw.length<6){setErr("비밀번호는 6자 이상이어야 합니다.");return;}
    if(pw!==pw2){setErr("비밀번호가 일치하지 않습니다.");return;}
    const admins=STORAGE.getAdmins();
    if(admins.find(a=>a.email===email.trim())){setErr("이미 등록된 이메일입니다.");return;}
    const now=new Date().toLocaleString("ko-KR");
    STORAGE.setAdmins([...admins,{id:Date.now(),name:name.trim(),email:email.trim(),pw,status:"pending",createdAt:now,approvedAt:null}]);
    setDone(true);
  };
  if(done)return(
    <div style={{textAlign:"center",padding:"40px 0"}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,color:C.success,marginBottom:8}}>신청 완료!</div>
      <div style={{fontSize:14,color:C.sub,lineHeight:1.7,marginBottom:24}}>최고관리자 승인 후 로그인이 가능합니다.</div>
      <button onClick={onBack} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 24px",color:C.sub,fontWeight:700,fontSize:14,cursor:"pointer"}}>로그인으로 돌아가기</button>
    </div>
  );
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={onBack} style={{background:C.bg,border:"none",borderRadius:8,width:32,height:32,color:C.sub,fontSize:18,cursor:"pointer"}}>←</button>
        <div style={{fontSize:17,fontWeight:800,color:C.text}}>기록 담당자 신청</div>
      </div>
      <div style={{background:C.warningBg,border:`1px solid ${C.warningBorder}`,borderRadius:10,padding:"12px 14px",marginBottom:20,fontSize:13,color:C.sub}}>
        신청 후 최고관리자 승인이 완료되어야 로그인할 수 있습니다.
      </div>
      {[{label:"이름 *",key:"name",ph:"홍길동"},{label:"이메일 *",key:"email",ph:"example@email.com"},{label:"비밀번호 * (6자 이상)",key:"pw",ph:"비밀번호 입력",type:"password"},{label:"비밀번호 확인 *",key:"pw2",ph:"비밀번호 재입력",type:"password"}].map(f=>(
        <div key={f.key} style={{marginBottom:12}}>
          <Label>{f.label}</Label>
          <Inp type={f.type||"text"} value={form[f.key]} onChange={v=>setForm(p=>({...p,[f.key]:v}))} placeholder={f.ph}/>
        </div>
      ))}
      {err&&<div style={{background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,color:C.danger}}>⚠ {err}</div>}
      <Btn onClick={handle} color="success" style={{width:"100%",marginTop:4}}>승인 신청하기</Btn>
    </div>
  );
}

  const match=matches.find(m=>m.id===matchId);

  if(!match)return null;
  const phase=match.phase||"pre"; const elSec=match.elapsedSec||0;
  const isFirst=phase==="first_half"; const isSecond=phase==="second_half";
  const isHalf=phase==="half_time"; const isRunning=isFirst||isSecond;
  const isPre=phase==="pre"; const isFinished=phase==="finished";
  const halfDur=match.halfDuration??(match.group==="B"?15:10);
  const fullDur=halfDur*2;
  const extraFirst=match.extraFirst||0; const extraSecond=match.extraSecond||0;
  const dSec=isSecond?(elSec-(match.firstHalfSec||0)):elSec;
  const rawMin=isSecond?Math.floor(dSec/60)+halfDur+1:Math.floor(elSec/60)+1;
  const capMin=isFirst?Math.min(halfDur,rawMin):isSecond?Math.min(fullDur,rawMin):rawMin;
  const extMin=isFirst?(rawMin>halfDur?rawMin-halfDur:0):isSecond?(rawMin>fullDur?rawMin-fullDur:0):0;
  const dStr=isHalf?"HT":isFinished?"FT":isRunning?(extMin>0?`${capMin}+${extMin}'${pad(dSec%60)}`:`${capMin}'${pad(dSec%60)}`):"--";
  const curMin=isRunning?(extMin>0?capMin+extMin:capMin):1;
  const goPhase=(next,msg,c=C.success)=>{
    const upd={phase:next};
    if(next==="half_time"){upd.firstHalfSec=elSec;upd.status="진행중";}
    if(next==="second_half"||next==="first_half"){upd.status="진행중";}
    if(next==="first_half"){upd.hs=match.hs??0;upd.as=match.as??0;}
    if(next==="finished"){upd.status="완료";}
    update(prev=>({...prev,...upd})); showN(msg,c);
  };
  const addGoal=(side,player,assist,method,min)=>{
    const sk=side==="home"?"hs":"as";
    update(prev=>({...prev,[sk]:(prev[sk]||0)+1,events:[...prev.events,{id:Date.now(),min,type:"goal",team:side,player,assist:assist||"",desc:method}]}));
    setModal(null); showN(`⚽ ${player}${assist?" 🤝"+assist:""} · ${method} · ${min}'`);
  };
  const addCard=(type,team,player,reason,min)=>{
    update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type,team,player,assist:"",desc:reason}]}));
    setModal(null); showN(`${type==="yellow"?"🟨":"🟥"} ${player} · ${min}'`);
  };
  const cancelGoal=(id)=>{
    const ev=match.events.find(e=>e.id===id); if(!ev)return;
    update(prev=>({...prev,[ev.team==="home"?"hs":"as"]:Math.max(0,(prev[ev.team==="home"?"hs":"as"]||0)-1),events:prev.events.filter(e=>e.id!==id)}));
    setModal(null); showN("🚫 골 취소",C.danger);
  };
  const liveColor=isRunning?"#16a34a":isPre?"#2563eb":"#64748b";
  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:C.text}}>
      <Notif n={notif}/>
      {modal==="goal_home"&&<GoalModal side="home" match={match} curMin={curMin} onConfirm={(p,a,m,mn)=>addGoal("home",p,a,m,mn)} onClose={()=>setModal(null)}/>}
      {modal==="goal_away"&&<GoalModal side="away" match={match} curMin={curMin} onConfirm={(p,a,m,mn)=>addGoal("away",p,a,m,mn)} onClose={()=>setModal(null)}/>}
      {(modal==="yellow"||modal==="red")&&<CardEventModal type={modal} match={match} curMin={curMin} onConfirm={(team,player,reason,min)=>addCard(modal,team,player,reason,min)} onClose={()=>setModal(null)}/>}
      {modal==="sub"&&<SubEventModal match={match} curMin={curMin} onConfirm={(team,out,inP,note,min)=>{update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type:"sub",team,player:`${out}→${inP}`,assist:"",desc:note||"선수 교체"}]}));setModal(null);showN(`🔄 ${out}→${inP} · ${min}'`);}} onClose={()=>setModal(null)}/>}
      {modal==="cancel"&&(
        <Modal onClose={()=>setModal(null)}>
          <div style={{fontSize:15,fontWeight:800,color:C.danger,marginBottom:14}}>🚫 골 취소</div>
          {match.events.filter(e=>e.type==="goal").length===0
            ?<div style={{textAlign:"center",padding:"20px 0",color:C.muted}}>취소할 골이 없습니다</div>
            :match.events.filter(e=>e.type==="goal").map(e=>(
              <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:10,padding:"10px 14px",marginBottom:7}}>
                <span>⚽</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.text}}>{e.player}{e.assist?<span style={{color:C.primary}}> 🤝{e.assist}</span>:""}</div>
                  <div style={{fontSize:11,color:C.muted}}>{e.desc} · {e.min}' · {e.team==="home"?match.home.name:match.away.name}</div>
                </div>
                <button onClick={()=>cancelGoal(e.id)} style={{background:C.danger,border:"none",borderRadius:7,padding:"6px 12px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>취소</button>
              </div>
            ))}
        </Modal>
      )}
      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#2563eb)",padding:"12px 16px",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:9,width:34,height:34,color:"#fff",fontSize:18,cursor:"pointer"}}>←</button>
          <div style={{flex:1,fontSize:12,color:"rgba(255,255,255,.7)",textAlign:"center"}}>{match.date} · {match.time} · {match.field} · {match.group}조 · {halfDur}분</div>
          <div style={{background:"rgba(255,255,255,.2)",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,color:"#fff"}}>📝 {adminName}</div>
        </div>
        {/* 스코어 */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0"}}>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:26}}>{match.home.emoji}</div>
            <div style={{fontSize:14,fontWeight:800,marginTop:4,color:"#fff"}}>{match.home.name}</div>
          </div>
          <div style={{textAlign:"center",padding:"0 12px"}}>
            {isPre
              ?<div style={{fontSize:22,fontWeight:900,color:"rgba(255,255,255,.7)"}}>VS</div>
              :<div>
                <div style={{fontSize:44,fontWeight:900,letterSpacing:6,fontVariantNumeric:"tabular-nums",color:"#fff"}}>
                  {match.hs??0} <span style={{fontSize:22,color:"rgba(255,255,255,.5)"}}>:</span> {match.as??0}
                </div>
                <div style={{fontSize:12,color:"rgba(255,255,255,.8)",fontWeight:700,marginTop:2}}>{dStr}</div>
              </div>
            }
          </div>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:26}}>{match.away.emoji}</div>
            <div style={{fontSize:14,fontWeight:800,marginTop:4,color:"#fff"}}>{match.away.name}</div>
          </div>
        </div>
        <div style={{display:"flex",borderTop:"1px solid rgba(255,255,255,.2)",marginTop:8}}>
          {["타임라인","통계"].map((t,i)=>{const k=["timeline","stats"][i];return<button key={t} onClick={()=>setTab(k)} style={{flex:1,padding:"9px 0",border:"none",background:"transparent",cursor:"pointer",fontSize:13,fontWeight:tab===k?800:500,color:tab===k?"#fff":"rgba(255,255,255,.5)",borderBottom:tab===k?"2px solid #fff":"2px solid transparent"}}>{t}</button>;})}
        </div>
      </div>
      <div style={{padding:"16px 16px 80px",maxWidth:600,margin:"0 auto"}}>
        {tab==="timeline"&&(
          <div>
            {/* 진행 관리 */}
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={{fontSize:13,fontWeight:700,color:C.sub,marginBottom:10}}>🎮 경기 진행 관리</div>
              {isPre&&(
                <div style={{background:C.primaryBg,border:`1px solid ${C.primaryBorder}`,borderRadius:10,padding:12,marginBottom:10}}>
                  <div style={{fontSize:12,color:C.primary,fontWeight:700,marginBottom:8}}>📅 일정 수정</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div><div style={{fontSize:11,color:C.sub,marginBottom:4}}>날짜</div><input value={match.date} onChange={e=>update(p=>({...p,date:e.target.value}))} style={{width:"100%",background:"#fff",border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 10px",color:C.text,fontSize:13,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/></div>
                    <div><div style={{fontSize:11,color:C.sub,marginBottom:4}}>시간</div><input value={match.time} onChange={e=>update(p=>({...p,time:e.target.value}))} style={{width:"100%",background:"#fff",border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 10px",color:C.text,fontSize:13,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/></div>
                  </div>
                  <div style={{fontSize:11,color:C.success,fontWeight:700,marginBottom:6}}>⏱ 러닝타임</div>
                  <div style={{display:"flex",gap:6,marginBottom:8}}>
                    {[{l:"U-11 10분",v:10,c:"#e74c3c"},{l:"U-9 15분",v:15,c:"#16a34a"},{l:"U-13 10분",v:10,c:"#8e44ad"}].map(p=>(
                      <button key={p.l} onClick={()=>update(prev=>({...prev,halfDuration:p.v}))} style={{flex:1,background:halfDur===p.v?`${p.c}15`:"#fff",border:`1px solid ${halfDur===p.v?p.c:C.border}`,borderRadius:7,padding:"7px 4px",color:halfDur===p.v?p.c:C.sub,fontWeight:halfDur===p.v?700:400,fontSize:11,cursor:"pointer"}}>{p.l}</button>
                    ))}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <button onClick={()=>update(p=>({...p,halfDuration:Math.max(5,halfDur-1)}))} style={{width:32,height:32,borderRadius:7,background:"#fff",border:`1px solid ${C.border}`,color:C.sub,fontSize:16,cursor:"pointer"}}>−</button>
                    <div style={{flex:1,textAlign:"center"}}><span style={{fontSize:22,fontWeight:900,color:C.success}}>{halfDur}</span><span style={{fontSize:13,color:C.sub,marginLeft:4}}>분 (전후반 각)</span></div>
                    <button onClick={()=>update(p=>({...p,halfDuration:Math.min(30,halfDur+1)}))} style={{width:32,height:32,borderRadius:7,background:"#fff",border:`1px solid ${C.border}`,color:C.sub,fontSize:16,cursor:"pointer"}}>+</button>
                  </div>
                </div>
              )}
              {/* 타이머 표시 */}
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"12px 14px",background:isRunning?"#f0fdf4":C.bg,borderRadius:10,border:`1px solid ${isRunning?C.successBorder:C.border}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:liveColor,flexShrink:0}}/>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:liveColor,fontWeight:700}}>{PHASE_LABEL[phase]}</div>
                  {(isRunning||isPre)&&<div style={{fontSize:11,color:C.muted,marginTop:1}}>전후반 각 {halfDur}분</div>}
                </div>
                <div style={{fontSize:28,fontWeight:900,color:extMin>0?C.warning:liveColor,fontVariantNumeric:"tabular-nums",letterSpacing:-1}}>{dStr}</div>
              </div>
              {/* 추가시간 */}
              {(isFirst||isSecond)&&(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.sub,marginBottom:6}}>{isFirst?"전반":"후반"} 추가시간</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,background:C.warningBg,border:`1px solid ${C.warningBorder}`,borderRadius:9,padding:"9px 12px"}}>
                    <button onClick={()=>update(p=>({...p,[isFirst?"extraFirst":"extraSecond"]:Math.max(0,(isFirst?extraFirst:extraSecond)-1)}))} style={{width:28,height:28,borderRadius:6,background:"#fff",border:`1px solid ${C.border}`,color:C.sub,fontSize:14,cursor:"pointer"}}>−</button>
                    <div style={{flex:1,textAlign:"center"}}><span style={{fontSize:20,fontWeight:900,color:C.warning}}>{isFirst?extraFirst:extraSecond}</span><span style={{fontSize:12,color:C.sub,marginLeft:4}}>분</span></div>
                    <button onClick={()=>update(p=>({...p,[isFirst?"extraFirst":"extraSecond"]:Math.min(15,(isFirst?extraFirst:extraSecond)+1)}))} style={{width:28,height:28,borderRadius:6,background:"#fff",border:`1px solid ${C.border}`,color:C.sub,fontSize:14,cursor:"pointer"}}>+</button>
                  </div>
                </div>
              )}
              {isPre&&<Btn onClick={()=>goPhase("first_half","▶ 경기 시작!")} color="success" style={{width:"100%"}}>▶ 경기 시작 (전반 {halfDur}분)</Btn>}
              {isFirst&&<Btn onClick={()=>goPhase("half_time","⏸ 전반 종료",C.warning)} color="warning" style={{width:"100%"}}>⏸ 전반 종료{extraFirst>0?` (+${extraFirst}분)`:""}</Btn>}
              {isHalf&&<Btn onClick={()=>goPhase("second_half","▶ 후반 시작!")} color="success" style={{width:"100%"}}>▶ 후반 시작 (후반 {halfDur}분)</Btn>}
              {isSecond&&<Btn onClick={()=>goPhase("finished","🏁 경기 종료!",C.danger)} color="danger" style={{width:"100%"}}>🏁 경기 종료{extraSecond>0?` (+${extraSecond}분)`:""}</Btn>}
              {isFinished&&<div style={{textAlign:"center",padding:"8px 0",fontSize:13,color:C.muted}}>경기 종료 (전후반 {halfDur}분)</div>}
            </div>
            {/* 이벤트 입력 */}
            {isRunning&&(
              <div style={{background:C.card,border:`2px solid ${C.warning}`,borderRadius:14,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                  <span style={{fontSize:13,fontWeight:800,color:C.warning}}>📝 이벤트 입력</span>
                  <button onClick={()=>setModal("cancel")} style={{marginLeft:"auto",background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:20,padding:"4px 12px",color:C.danger,fontSize:12,fontWeight:700,cursor:"pointer"}}>🚫 골 취소</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                  <button onClick={()=>setModal("goal_home")} style={{background:match.home.color,border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>⚽ {match.home.emoji} 홈 골</button>
                  <button onClick={()=>setModal("goal_away")} style={{background:match.away.color,border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>⚽ {match.away.emoji} 원정 골</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                  <button onClick={()=>setModal("yellow")} style={{background:C.warningBg,border:`1px solid ${C.warningBorder}`,borderRadius:8,padding:"9px 4px",color:C.warning,fontWeight:700,fontSize:13,cursor:"pointer"}}>🟨 옐로</button>
                  <button onClick={()=>setModal("red")} style={{background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:8,padding:"9px 4px",color:C.danger,fontWeight:700,fontSize:13,cursor:"pointer"}}>🟥 레드</button>
                  <button onClick={()=>setModal("sub")} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 4px",color:C.sub,fontWeight:700,fontSize:13,cursor:"pointer"}}>🔄 교체</button>
                </div>
              </div>
            )}
            {/* 이벤트 로그 */}
            {!isPre&&(
              <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                <div style={{fontSize:13,fontWeight:700,color:C.sub,marginBottom:10}}>이벤트 로그</div>
                {match.events.length===0
                  ?<div style={{textAlign:"center",padding:"16px 0",color:C.muted,fontSize:13}}>기록된 이벤트가 없습니다</div>
                  :[...match.events].reverse().map(e=>{
                    const icon={goal:"⚽",yellow:"🟨",red:"🟥",sub:"🔄"}[e.type]||"●";
                    const isH=e.team==="home";
                    return <div key={e.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
                      <span style={{fontSize:11,fontWeight:700,background:C.primaryBg,color:C.primary,padding:"2px 6px",borderRadius:5,minWidth:26,textAlign:"center"}}>{e.min}'</span>
                      <span style={{fontSize:14}}>{icon}</span>
                      <span style={{fontSize:12,color:isH?match.home.color:match.away.color,fontWeight:600}}>{isH?match.home.name:match.away.name}</span>
                      <span style={{fontSize:12,color:C.text}}>{e.player}{e.assist?<span style={{color:C.primary}}> 🤝{e.assist}</span>:""}</span>
                      <span style={{fontSize:11,color:C.muted}}>{e.desc}</span>
                    </div>;
                  })
                }
              </div>
            )}
          </div>
        )}
        {tab==="stats"&&(
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            {isPre?<div style={{textAlign:"center",padding:"28px 0",color:C.muted}}>경기 시작 후 통계가 표시됩니다</div>:(
              <div>
                <div style={{marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontWeight:900,fontSize:18,color:match.home.color}}>{match.stats.possession[0]}%</span><span style={{fontSize:13,color:C.sub}}>점유율</span><span style={{fontWeight:900,fontSize:18,color:match.away.color}}>{match.stats.possession[1]}%</span></div>
                  <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden"}}><div style={{flex:match.stats.possession[0],background:match.home.color}}/><div style={{flex:match.stats.possession[1],background:match.away.color}}/></div>
                </div>
                {[["슈팅","shots"],["유효슈팅","shotsOnTarget"],["코너킥","corners"],["파울","fouls"]].map(([label,k])=>{
                  const h=match.stats[k][0],a=match.stats[k][1],tot=h+a||1;
                  return <div key={k} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:14}}><span style={{fontWeight:700,color:C.text}}>{h}</span><span style={{color:C.sub,fontSize:13}}>{label}</span><span style={{fontWeight:700,color:C.text}}>{a}</span></div>
                    <div style={{display:"flex",height:5,borderRadius:4,overflow:"hidden"}}><div style={{flex:Math.round(h/tot*100),background:C.primary}}/><div style={{flex:Math.round(a/tot*100),background:C.danger}}/></div>
                  </div>;
                })}
              </div>
            )}
          </div>
        )}
      </div>
      <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
    </div>
  );
}

// ── 팀/선수 관리 하위 컴포넌트 ──────────────────────────────────────────────
function MatchLineupView({match,matches,updateMatch,showNotif,onBack}){
  const [side,setSide]=useState("home");
  const [newPlayer,setNewPlayer]=useState("");
  const [newPos,setNewPos]=useState("df");
  const m=matches.find(x=>x.id===match?.id)||match;
  if(!m)return null;
  const teamInfo=side==="home"?m.home:m.away;
  const lineup=m.lineup?.[side]||{gk:[],df:[],mf:[],fw:[]};
  const POSITIONS=[{k:"gk",label:"GK"},{k:"df",label:"DF"},{k:"mf",label:"MF"},{k:"fw",label:"FW"}];
  const addPlayer=()=>{
    if(!newPlayer.trim())return;
    updateMatch(m.id,{...m,lineup:{...m.lineup,[side]:{...lineup,[newPos]:[...(lineup[newPos]||[]),newPlayer.trim()]}}});
    setNewPlayer(""); showNotif(`✅ ${newPlayer} 등록`);
  };
  const removePlayer=(pos,name)=>{
    updateMatch(m.id,{...m,lineup:{...m.lineup,[side]:{...lineup,[pos]:(lineup[pos]||[]).filter(p=>p!==name)}}});
  };
  return(
    <div style={{padding:"16px 16px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <button onClick={onBack} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,width:34,height:34,color:C.sub,fontSize:18,cursor:"pointer"}}>←</button>
        <div style={{fontSize:17,fontWeight:800,color:C.text}}>{m.home.emoji}{m.home.name} vs {m.away.emoji}{m.away.name}</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[{k:"home",info:m.home},{k:"away",info:m.away}].map(({k,info})=>(
          <button key={k} onClick={()=>setSide(k)} style={{flex:1,background:side===k?info.color:C.card,border:`2px solid ${side===k?info.color:C.border}`,borderRadius:10,padding:"10px 0",color:side===k?"#fff":C.sub,fontWeight:700,fontSize:15,cursor:"pointer"}}>
            {info.emoji} {k==="home"?"홈":"원정"}
          </button>
        ))}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
        <input value={newPlayer} onChange={e=>setNewPlayer(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter")addPlayer();}}
          placeholder="선수 이름 입력 후 Enter"
          style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit",marginBottom:8}}/>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          {POSITIONS.map(p=>(
            <button key={p.k} onClick={()=>setNewPos(p.k)}
              style={{flex:1,background:newPos===p.k?teamInfo.color:C.bg,border:`1px solid ${newPos===p.k?teamInfo.color:C.border}`,borderRadius:8,padding:"8px 0",color:newPos===p.k?"#fff":C.sub,fontSize:14,fontWeight:newPos===p.k?700:400,cursor:"pointer"}}>{p.label}</button>
          ))}
        </div>
        <button onClick={addPlayer} style={{width:"100%",background:teamInfo.color,border:"none",borderRadius:9,padding:"11px 0",color:"#fff",fontWeight:800,fontSize:15,cursor:"pointer"}}>＋ 선수 등록</button>
      </div>
      {POSITIONS.map(p=>{
        const players=lineup[p.k]||[];
        if(!players.length)return null;
        return(
          <div key={p.k} style={{marginBottom:12}}>
            <div style={{fontSize:13,fontWeight:700,color:C.sub,marginBottom:6}}>{p.label}</div>
            {players.map(name=>(
              <div key={name} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:9,padding:"10px 14px",marginBottom:5,display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 1px 2px rgba(0,0,0,.04)"}}>
                <span style={{fontSize:15,color:C.text}}>{name}</span>
                <button onClick={()=>removePlayer(p.k,name)} style={{background:C.dangerBg,border:"none",borderRadius:6,padding:"4px 9px",color:C.danger,fontSize:13,cursor:"pointer"}}>🗑</button>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// ── 공지사항 관리 탭 ──────────────────────────────────────────────────────────
function AdminNoticeTab({notices,setNotices,admin,showNotif}){
  const [view,setView]=useState("list"); // list | form
  const [editN,setEditN]=useState(null);
  const [form,setForm]=useState({title:"",body:"",pinned:false});
  const [err,setErr]=useState("");
  const [delTarget,setDelTarget]=useState(null);

  const openNew=()=>{setForm({title:"",body:"",pinned:false});setEditN(null);setErr("");setView("form");};
  const openEdit=(n)=>{setForm({title:n.title,body:n.body,pinned:!!n.pinned});setEditN(n);setErr("");setView("form");};

  const save=async()=>{
    if(!form.title.trim()){setErr("제목을 입력해주세요.");return;}
    if(!form.body.trim()){setErr("내용을 입력해주세요.");return;}
    const now=new Date().toLocaleString("ko-KR");
    let next;
    if(editN){
      next=notices.map(n=>n.id===editN.id?{...n,title:form.title.trim(),body:form.body.trim(),pinned:form.pinned,updatedAt:now}:n);
      showNotif("✅ 공지 수정 완료");
    } else {
      const newN={id:Date.now(),title:form.title.trim(),body:form.body.trim(),pinned:form.pinned,author:admin.name,createdAt:now,updatedAt:now};
      // 고정 공지는 맨 앞으로
      next=form.pinned?[newN,...notices]:[...notices,newN];
      showNotif("✅ 공지 등록 완료");
    }
    // 고정 공지 정렬 (고정 먼저)
    next=next.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
    setNotices(next);
    try{await FB.saveNotices(next);}catch{showNotif("저장 실패 (네트워크 확인)",C.danger);}
    setView("list");
  };

  const doDelete=async(id)=>{
    const next=notices.filter(n=>n.id!==id);
    setNotices(next);
    try{await FB.saveNotices(next);showNotif("🗑 공지 삭제",C.danger);}catch{showNotif("삭제 실패",C.danger);}
    setDelTarget(null);
  };

  // 삭제 확인 모달
  if(delTarget){
    const n=notices.find(x=>x.id===delTarget);
    return(
      <div style={{padding:"16px 16px 80px"}}>
        <div style={{background:C.card,border:`1px solid ${C.dangerBorder}`,borderRadius:14,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
          <div style={{fontSize:16,fontWeight:800,color:C.danger,marginBottom:8}}>🗑 공지 삭제</div>
          <div style={{fontSize:14,color:C.text,marginBottom:4,fontWeight:600}}>{n?.title}</div>
          <div style={{fontSize:13,color:C.sub,marginBottom:20}}>이 공지를 삭제하면 복구할 수 없어요.</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Btn onClick={()=>setDelTarget(null)} color="ghost" style={{width:"100%"}}>취소</Btn>
            <Btn onClick={()=>doDelete(delTarget)} color="danger" style={{width:"100%"}}>삭제</Btn>
          </div>
        </div>
      </div>
    );
  }

  // 작성/수정 폼
  if(view==="form") return(
    <div style={{padding:"16px 16px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <button onClick={()=>setView("list")} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,width:34,height:34,color:C.sub,fontSize:18,cursor:"pointer"}}>←</button>
        <div style={{fontSize:17,fontWeight:800,color:C.text}}>{editN?"공지 수정":"새 공지 작성"}</div>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:18,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{marginBottom:12}}>
          <Label>제목 *</Label>
          <input value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))} placeholder="공지 제목 입력"
            style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 14px",color:C.text,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
        </div>
        <div style={{marginBottom:14}}>
          <Label>내용 *</Label>
          <textarea value={form.body} onChange={e=>setForm(p=>({...p,body:e.target.value}))} placeholder="공지 내용 입력" rows={6}
            style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 14px",color:C.text,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit",resize:"vertical",lineHeight:1.6}}/>
        </div>
        {/* 상단 고정 */}
        <button onClick={()=>setForm(p=>({...p,pinned:!p.pinned}))}
          style={{width:"100%",background:form.pinned?"#fef3c7":C.bg,border:`1px solid ${form.pinned?"#fbbf24":C.border}`,borderRadius:10,padding:"12px 14px",color:form.pinned?"#b45309":C.sub,fontWeight:form.pinned?700:400,fontSize:14,cursor:"pointer",textAlign:"left",marginBottom:14,display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>{form.pinned?"📌":"📍"}</span>
          {form.pinned?"상단 고정 중 (탭하면 해제)":"상단 고정"}
        </button>
        {err&&<div style={{background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,color:C.danger}}>⚠ {err}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Btn onClick={()=>setView("list")} color="ghost" style={{width:"100%"}}>취소</Btn>
          <Btn onClick={save} color="success" style={{width:"100%"}}>{editN?"수정 완료":"등록"}</Btn>
        </div>
      </div>
    </div>
  );

  // 목록
  return(
    <div style={{padding:"16px 16px 80px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:19,fontWeight:800,color:C.text}}>공지사항 관리</div>
        <Btn onClick={openNew} color="success" style={{padding:"8px 14px",fontSize:14}}>＋ 공지 작성</Btn>
      </div>
      {notices.length===0
        ?<div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>
          <div style={{fontSize:32,marginBottom:10}}>📢</div>
          <div style={{fontSize:14}}>등록된 공지사항이 없어요</div>
          <div style={{fontSize:13,color:C.muted,marginTop:4}}>새 공지 작성으로 시작해보세요</div>
         </div>
        :notices.map(n=>(
          <div key={n.id} style={{background:C.card,border:`1px solid ${n.pinned?"#fbbf24":C.border}`,borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:8}}>
              {n.pinned&&<span style={{fontSize:12,background:"#fef3c7",color:"#b45309",fontWeight:800,padding:"2px 8px",borderRadius:20,flexShrink:0,marginTop:2,border:"1px solid #fcd34d"}}>📌 고정</span>}
              <div style={{fontSize:15,fontWeight:700,color:C.text,flex:1,lineHeight:1.4}}>{n.title}</div>
            </div>
            <div style={{fontSize:14,color:C.sub,marginBottom:10,lineHeight:1.6,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.body}</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{fontSize:12,color:C.muted}}>📝 {n.author} · {n.createdAt}</div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>openEdit(n)} style={{background:C.primaryBg,border:`1px solid ${C.primaryBorder}`,borderRadius:8,padding:"6px 12px",color:C.primary,fontSize:13,fontWeight:600,cursor:"pointer"}}>✏️ 수정</button>
                <button onClick={()=>setDelTarget(n.id)} style={{background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:8,padding:"6px 12px",color:C.danger,fontSize:13,fontWeight:600,cursor:"pointer"}}>🗑 삭제</button>
              </div>
            </div>
          </div>
        ))
      }
    </div>
  );
}

// ── AdminApp ──────────────────────────────────────────────────────────────────
function AdminApp({admin,onLogout}){
  const [tab,setTab]=useState("schedule");
  const [matches,setMatches]=useState(INIT_MATCHES);
  const [notices,setNotices]=useState([]);
  const [detailId,setDetailId]=useState(null);
  const [notif,setNotif]=useState(null);
  const [confirmLogout,setConfirmLogout]=useState(false);
  const [showAddMatch,setShowAddMatch]=useState(false);
  const [newMF,setNewMF]=useState({date:"05/30",time:"11:00",field:"제1구장",group:"A",hn:"",he:"⚽",an:"",ae:"⚽"});
  const [teams,setTeams]=useState(()=>{try{return JSON.parse(localStorage.getItem("kickoff_admin_teams")||"null")||[
    {id:1,name:"슈퍼판다A",emoji:"🐼",color:"#e74c3c",group:"A",members:[]},
    {id:2,name:"슈팅FC",emoji:"⚽",color:"#3498db",group:"A",members:[]},
    {id:3,name:"알쎄븐",emoji:"⑦",color:"#9b59b6",group:"A",members:[]},
    {id:4,name:"슈퍼판다B",emoji:"🐼",color:"#e67e22",group:"A",members:[]},
    {id:5,name:"U11연합",emoji:"🤝",color:"#1abc9c",group:"A",members:[]},
    {id:6,name:"슈퍼판다(U9)",emoji:"🐼",color:"#2ecc71",group:"B",members:[]},
    {id:7,name:"불사조",emoji:"🔥",color:"#f39c12",group:"B",members:[]},
    {id:8,name:"세븐이글스",emoji:"🦅",color:"#8e44ad",group:"C",members:[]},
    {id:9,name:"광명흰돌연합",emoji:"⚪",color:"#64748b",group:"C",members:[]},
    {id:10,name:"제이알쎄븐",emoji:"⑦",color:"#2980b9",group:"C",members:[]},
    {id:11,name:"U13연합이글",emoji:"🦅",color:"#16a085",group:"C",members:[]},
  ];}catch{return [];}});
  const [officials,setOfficials]=useState(()=>{try{return JSON.parse(localStorage.getItem("kickoff_admin_officials")||"[]");}catch{return [];}});

  const saveTeams=(t)=>{setTeams(t);try{localStorage.setItem("kickoff_admin_teams",JSON.stringify(t));}catch{}};
  const saveOfficials=(o)=>{setOfficials(o);try{localStorage.setItem("kickoff_admin_officials",JSON.stringify(o));}catch{}};
  const showNotif=(msg,color=C.success)=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2200);};

  // Firebase 동기화
  useEffect(()=>{
    const unsub=FB.watchMatches(list=>{if(list&&list.length>0)setMatches(list);});
    const unsubN=FB.watchNotices(list=>{if(list)setNotices(list);});
    return ()=>{unsub();unsubN();};
  },[]);

  const updateMatch=useCallback((id,updated)=>{
    setMatches(prev=>{
      const next=prev.map(m=>m.id===id?(typeof updated==="function"?updated(m):updated):m);
      FB.saveMatches(next).catch(()=>{});
      return next;
    });
  },[]);

  const groupInfo={
    A:{label:"A조 · U-11 · 제1구장",color:"#dc2626"},
    B:{label:"B조 · U-9  · 제2구장",color:"#16a34a"},
    C:{label:"C조 · U-13 · 제2구장",color:"#7c3aed"},
  };

  const phaseStyle={
    pre:{bg:"#eff6ff",text:"#2563eb"},
    first_half:{bg:"#f0fdf4",text:"#16a34a"},
    half_time:{bg:"#fffbeb",text:"#d97706"},
    second_half:{bg:"#f0fdf4",text:"#16a34a"},
    finished:{bg:"#f1f5f9",text:"#64748b"},
  };

  // 경기 통계
  const goals=matches.flatMap(m=>m.events.filter(e=>e.type==="goal"));
  const yellows=matches.flatMap(m=>m.events.filter(e=>e.type==="yellow"));
  const reds=matches.flatMap(m=>m.events.filter(e=>e.type==="red"));

  const MatchCard=({m})=>{
    const phase=m.phase||"pre";
    const isRunning=phase==="first_half"||phase==="second_half";
    const halfDur=m.halfDuration??(m.group==="B"?15:10);
    const ps=phaseStyle[phase]||phaseStyle.pre;
    const gc=groupInfo[m.group];
    const phaseLabel={pre:"경기 전",first_half:"전반",half_time:"하프타임",second_half:"후반",finished:"종료"};
    return(
      <div style={{background:C.card,border:`1px solid ${isRunning?"#16a34a":C.border}`,borderRadius:14,padding:14,marginBottom:10,boxShadow:isRunning?"0 0 0 2px #bbf7d0":"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12,fontWeight:700,background:`${gc?.color}15`,color:gc?.color,padding:"2px 8px",borderRadius:10}}>{m.group}조</span>
            <span style={{fontSize:13,color:C.muted}}>🕐 {m.time} · {m.field} · {halfDur}분</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            {isRunning&&<span style={{width:6,height:6,borderRadius:"50%",background:"#16a34a",display:"inline-block",animation:"blink 1.5s infinite"}}/>}
            <span style={{fontSize:12,fontWeight:700,padding:"3px 9px",borderRadius:20,background:ps.bg,color:ps.text}}>{phaseLabel[phase]}</span>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:28}}>{m.home.emoji}</span>
            <div>
              <div style={{fontSize:16,fontWeight:700,color:C.text}}>{m.home.name}</div>
              {m.events?.filter(e=>e.type==="goal"&&e.team==="home").map(e=><div key={e.id} style={{fontSize:11,color:C.muted}}>⚽ {e.player} {e.min}'</div>)}
            </div>
          </div>
          <div style={{textAlign:"center",padding:"0 10px"}}>
            {m.hs!==null
              ?<div style={{fontSize:32,fontWeight:900,color:isRunning?"#16a34a":C.text,fontVariantNumeric:"tabular-nums"}}>{m.hs??0}<span style={{fontSize:20,color:C.muted,margin:"0 4px"}}>:</span>{m.as??0}</div>
              :<div style={{fontSize:18,color:C.muted,fontWeight:700}}>VS</div>
            }
          </div>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end",textAlign:"right"}}>
            <div>
              <div style={{fontSize:16,fontWeight:700,color:C.text}}>{m.away.name}</div>
              {m.events?.filter(e=>e.type==="goal"&&e.team==="away").map(e=><div key={e.id} style={{fontSize:11,color:C.muted}}>⚽ {e.player} {e.min}'</div>)}
            </div>
            <span style={{fontSize:28}}>{m.away.emoji}</span>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
          {phase==="pre"
            ?<button onClick={()=>{if(!window.confirm(`${m.home.name} vs ${m.away.name} 경기를 삭제할까요?`))return;setMatches(prev=>{const next=prev.filter(x=>x.id!==m.id);FB.saveMatches(next).catch(()=>{});return next;});showNotif("🗑 경기 삭제",C.danger);}}
               style={{background:C.dangerBg,border:`1px solid ${C.dangerBorder}`,borderRadius:8,padding:"7px 12px",color:C.danger,fontWeight:700,fontSize:14,cursor:"pointer"}}>
               🗑 삭제
             </button>
            :<div/>
          }
          <button onClick={()=>setDetailId(m.id)}
            style={{background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:8,padding:"8px 16px",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>
            📝 기록 입력
          </button>
        </div>
      </div>
    );
  };

  const navTabs=[
    {id:"schedule",icon:"📅",label:"일정"},
    {id:"notice",  icon:"📢",label:"공지"},
    {id:"roster",  icon:"👥",label:"팀/선수"},
    {id:"stats",   icon:"📊",label:"통계"},
  ];

  if(detailId!==null)return(
    <MatchDetail matchId={detailId} matches={matches} onUpdateMatch={updateMatch}
      onBack={()=>setDetailId(null)} adminName={admin.name}/>
  );

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Noto Sans KR',sans-serif",color:C.text,maxWidth:520,margin:"0 auto"}}>
      <Notif n={notif}/>
      {confirmLogout&&(
        <Modal onClose={()=>setConfirmLogout(false)}>
          <div style={{textAlign:"center",padding:"8px 0 16px"}}>
            <div style={{fontSize:32,marginBottom:10}}>📝</div>
            <div style={{fontSize:15,fontWeight:800,marginBottom:6}}>로그아웃 하시겠습니까?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:20}}>
              <Btn onClick={()=>setConfirmLogout(false)} color="ghost" style={{width:"100%"}}>취소</Btn>
              <Btn onClick={()=>{STORAGE.clearSession();onLogout();}} color="danger" style={{width:"100%"}}>로그아웃</Btn>
            </div>
          </div>
        </Modal>
      )}
      {/* 경기 추가 모달 */}
      {showAddMatch&&(
        <Modal onClose={()=>setShowAddMatch(false)}>
          <div style={{fontSize:17,fontWeight:800,color:C.text,marginBottom:18}}>➕ 경기 추가</div>
          {[{label:"날짜",k:"date",ph:"05/30"},{label:"시간",k:"time",ph:"11:00"},{label:"경기장",k:"field",ph:"제1구장"},{label:"조 (A/B/C)",k:"group",ph:"A"},{label:"홈팀 이름",k:"hn",ph:"슈퍼판다A"},{label:"홈팀 이모지",k:"he",ph:"🐼"},{label:"원정팀 이름",k:"an",ph:"슈팅FC"},{label:"원정팀 이모지",k:"ae",ph:"⚽"}].map(f=>(
            <div key={f.k} style={{marginBottom:10}}>
              <Label>{f.label}</Label>
              <input value={newMF[f.k]||""} onChange={e=>setNewMF(p=>({...p,[f.k]:e.target.value}))} placeholder={f.ph}
                style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.text,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
            </div>
          ))}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:6}}>
            <Btn onClick={()=>setShowAddMatch(false)} color="ghost" style={{width:"100%"}}>취소</Btn>
            <Btn onClick={()=>{
              if(!newMF.hn.trim()||!newMF.an.trim()){showNotif("홈팀/원정팀 이름을 입력해주세요",C.danger);return;}
              const grp=(newMF.group||"A").toUpperCase();
              const nid=Math.max(0,...matches.map(m=>m.id))+1;
              const nm=mkMatch(nid,newMF.date||"05/30",newMF.time||"11:00",newMF.field||"제1구장",grp,newMF.hn,newMF.he||"⚽","#3498db",newMF.an,newMF.ae||"⚽","#e74c3c");
              setMatches(prev=>{const next=[...prev,nm];FB.saveMatches(next).catch(()=>{});return next;});
              setNewMF({date:"05/30",time:"11:00",field:"제1구장",group:"A",hn:"",he:"⚽",an:"",ae:"⚽"});
              setShowAddMatch(false); showNotif(`✅ ${newMF.hn} vs ${newMF.an} 추가!`);
            }} color="success" style={{width:"100%"}}>추가</Btn>
          </div>
        </Modal>
      )}
      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#2563eb)",padding:"12px 16px",position:"sticky",top:0,zIndex:10,display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📝</div>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:900,color:"#fff"}}>은하수대회 Admin</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.7)"}}>{admin.name}</div>
        </div>
        <button onClick={()=>setConfirmLogout(true)} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,padding:"6px 12px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>로그아웃</button>
      </div>
      {/* 본문 */}
      <div style={{padding:"16px 16px 80px"}}>
        {/* 일정 탭 */}
        {tab==="schedule"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <div style={{fontSize:19,fontWeight:800,color:C.text}}>경기 일정</div>
              <Btn onClick={()=>setShowAddMatch(true)} color="success" style={{padding:"8px 14px",fontSize:14}}>＋ 경기 추가</Btn>
            </div>
            {["A","B","C"].map(grp=>{
              const gm=matches.filter(m=>m.group===grp);
              const gi=groupInfo[grp];
              return(
                <div key={grp} style={{marginBottom:20}}>
                  <div style={{fontSize:14,fontWeight:700,color:gi.color,marginBottom:10,letterSpacing:.5}}>{gi.label}</div>
                  {gm.map(m=><MatchCard key={m.id} m={m}/>)}
                </div>
              );
            })}
          </div>
        )}
        {/* 공지 탭 */}
        {tab==="notice"&&<AdminNoticeTab notices={notices} setNotices={setNotices} admin={admin} showNotif={showNotif}/>}

        {/* 팀/선수 탭 */}
        {tab==="roster"&&(
          <RosterTab teams={teams} saveTeams={saveTeams} officials={officials} saveOfficials={saveOfficials}
            matches={matches} updateMatch={updateMatch} showNotif={showNotif}/>
        )}
        {/* 통계 탭 */}
        {tab==="stats"&&(
          <div>
            <div style={{fontSize:19,fontWeight:800,color:C.text,marginBottom:14}}>기록 통계</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:20}}>
              {[{icon:"✅",label:"완료",value:matches.filter(m=>m.phase==="finished").length,color:C.success},
                {icon:"⚽",label:"총 득점",value:goals.length,color:C.primary},
                {icon:"🟨",label:"경고",value:yellows.length,color:"#d97706"}].map(k=>(
                <div key={k.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,textAlign:"center",boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
                  <div style={{fontSize:22,marginBottom:4}}>{k.icon}</div>
                  <div style={{fontSize:28,fontWeight:900,color:k.color}}>{k.value}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>{k.label}</div>
                </div>
              ))}
            </div>
            {/* 조별 순위 */}
            {["A","B","C"].map(grp=>{
              const gi=groupInfo[grp];
              const tMap={};
              matches.filter(m=>m.group===grp).forEach(m=>{
                [m.home,m.away].forEach(t=>{if(!tMap[t.name])tMap[t.name]={name:t.name,emoji:t.emoji,color:t.color,p:0,w:0,d:0,l:0,gf:0,ga:0};});
                if(m.phase!=="finished")return;
                const h=tMap[m.home.name],a=tMap[m.away.name];
                h.p++;a.p++;
                const hs=m.hs||0,as=m.as||0;
                h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
                if(hs>as){h.w++;a.l++;}else if(hs<as){a.w++;h.l++;}else{h.d++;a.d++;}
              });
              const sorted=Object.values(tMap).sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||(b.gf-b.ga)-(a.gf-a.ga));
              return(
                <div key={grp} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,marginBottom:14,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
                  <div style={{padding:"10px 14px",background:`${gi.color}10`,borderBottom:`1px solid ${C.border}`,fontSize:13,fontWeight:700,color:gi.color}}>{gi.label}</div>
                  {sorted.length===0?<div style={{padding:"14px",textAlign:"center",color:C.muted,fontSize:13}}>경기 대기중</div>:sorted.map((t,i)=>(
                    <div key={t.name} style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:`1px solid ${C.border}`,gap:8}}>
                      <span style={{fontSize:14,minWidth:20,textAlign:"center"}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":<span style={{color:C.muted,fontSize:12}}>{i+1}</span>}</span>
                      <span style={{fontSize:18}}>{t.emoji}</span>
                      <span style={{flex:1,fontSize:14,fontWeight:i<2?700:500,color:C.text}}>{t.name}</span>
                      {[{v:t.p,l:"경"},{v:t.w,l:"승"},{v:t.d,l:"무"},{v:t.l,l:"패"},{v:t.gf-t.ga>0?`+${t.gf-t.ga}`:t.gf-t.ga,l:"득실"}].map(({v,l})=>(
                        <div key={l} style={{textAlign:"center",minWidth:28}}><div style={{fontSize:13,fontWeight:600,color:C.text}}>{v}</div><div style={{fontSize:10,color:C.muted}}>{l}</div></div>
                      ))}
                      <div style={{textAlign:"center",minWidth:32}}><div style={{fontSize:18,fontWeight:900,color:i===0?"#d97706":C.text}}>{t.w*3+t.d}</div><div style={{fontSize:10,color:C.muted}}>승점</div></div>
                    </div>
                  ))}
                </div>
              );
            })}
            {/* 득점 순위 */}
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
              <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,fontSize:13,fontWeight:700,color:C.sub}}>⚽ 득점 순위</div>
              {goals.length===0?<div style={{padding:"14px",textAlign:"center",color:C.muted,fontSize:13}}>득점 기록 없음</div>:(()=>{
                const pMap={};
                goals.forEach(e=>{if(!pMap[e.player])pMap[e.player]={name:e.player,goals:0,assists:0};pMap[e.player].goals++;if(e.assist&&e.assist!=="없음"&&e.assist!==""){if(!pMap[e.assist])pMap[e.assist]={name:e.assist,goals:0,assists:0};pMap[e.assist].assists++;}});
                return Object.values(pMap).sort((a,b)=>b.goals-a.goals||b.assists-a.assists).slice(0,10).map((p,i)=>(
                  <div key={p.name} style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:`1px solid ${C.border}`,gap:10}}>
                    <span style={{fontSize:13,fontWeight:800,color:i===0?"#d97706":i===1?"#94a3b8":i===2?"#92400e":C.muted,minWidth:20,textAlign:"center"}}>{i+1}</span>
                    <span style={{flex:1,fontSize:14,fontWeight:600,color:C.text}}>{p.name}</span>
                    <div style={{display:"flex",gap:10}}>
                      <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:900,color:C.success}}>{p.goals}</div><div style={{fontSize:10,color:C.muted}}>골</div></div>
                      <div style={{textAlign:"center"}}><div style={{fontSize:15,fontWeight:700,color:C.primary}}>{p.assists}</div><div style={{fontSize:10,color:C.muted}}>도움</div></div>
                    </div>
                  </div>
                ));
              })()}
            </div>
          </div>
        )}
      </div>
      {/* 하단 네비 */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:520,background:"#fff",borderTop:`1px solid ${C.border}`,display:"flex",boxShadow:"0 -2px 8px rgba(0,0,0,.08)"}}>
        {navTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0 8px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:11,fontWeight:tab===t.id?800:500,color:tab===t.id?C.primary:C.muted}}>{t.label}</span>
            {tab===t.id&&<div style={{width:20,height:2,background:C.primary,borderRadius:2}}/>}
          </button>
        ))}
      </div>
      <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}`}</style>
    </div>
  );
}

// ── 앱 진입점 ─────────────────────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(()=>STORAGE.getSession());
  if(!session)return <LoginPage onLogin={s=>{STORAGE.setSession(s);setSession(s);}}/>;
  if(session.isMaster)return <MasterPanel onLogout={()=>{STORAGE.clearSession();setSession(null);}} showNotif={()=>{}}/>;
  return <AdminApp admin={session} onLogout={()=>{STORAGE.clearSession();setSession(null);}}/>;
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
